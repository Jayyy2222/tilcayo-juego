<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Ticayo - Parte 4: Salto y torreta</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <style type="text/css">
        body {
            margin: 0;
            background: #0b1a12;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>

<script type="text/javascript">

// =====================================================
//  TICAYO - Parte 4: salto y torreta
//  - Animación de salto del Ticayo (Tilcayo_jump.png)
//  - Una torreta enemiga (torreta.png) dispara al Ticayo cuando se acerca
//  - Con el poder de la carne se puede destruir la torreta con las espadas
//  (de la parte 3: carnes de poder, guerrero con espadas, espinas cortables)
//  Controles: ← → caminar, ↑ o ESPACIO saltar, X atacar (con poder), R reiniciar
// =====================================================

var ANCHO = 800;
var ALTO = 600;
var ANCHO_NIVEL = 3200;
var SUELO_Y = 520;   // borde de arriba del suelo
var AGUA_Y = 540;    // superficie del agua

// Tramos de suelo [inicio, fin]; los huecos entre ellos son agua
var TRAMOS_SUELO = [[0, 760], [900, 1500], [1680, 2320], [2480, 3200]];

// Árboles grandes del nivel (más adelante se podrán trepar)
var ARBOLES_NIVEL = [1110, 2070];

// Ramas [x, y, ancho] pegadas a los árboles del nivel
var RAMAS = [
    [960, 390, 150], [1150, 290, 140], [1000, 190, 150],
    [1920, 380, 150], [2110, 280, 140], [1960, 180, 150]
];

// Obstáculos sobre el suelo
var OBSTACULOS = [
    { tipo: 'tocon',   x: 330 },
    { tipo: 'roca',    x: 560 },
    { tipo: 'tronco',  x: 1320 },
    { tipo: 'espinas', x: 1820 },
    { tipo: 'roca',    x: 2640 },
    { tipo: 'espinas', x: 2850 },
    { tipo: 'tocon',   x: 3020 }
];

// Tamaño de la caja de choque de cada obstáculo [ancho, alto]
var CAJAS_OBSTACULO = {
    tocon:   [52, 45],
    roca:    [84, 46],
    tronco:  [150, 42],
    espinas: [70, 40]
};

// Carnes de poder [tipo, x, y]
var CARNES = [
    ['carne',  450,  SUELO_Y - 30],
    ['filete', 1070, 160],             // arriba en la rama más alta
    ['carne',  1320, SUELO_Y - 75],    // encima del tronco caído
    ['filete', 1590, 430],             // sobre el agua: hay que saltar
    ['carne',  2180, 250],
    ['filete', 2740, SUELO_Y - 30]     // justo antes de las espinas
];

var DURACION_PODER = 30000;   // 30 segundos

// Contorno del gato en cada cuadro de Tilcayo_jump.png [izq, arriba, der, abajo].
// En la hoja el gato sube y baja dentro del cuadro; con esto lo recortamos
// y lo centramos, así el salto lo hacen las físicas y no el dibujo.
var CONTORNOS_SALTO = [
    [46, 144, 178, 208], [44, 140, 176, 208], [41, 117, 168, 208], [45, 97, 166, 208], [52, 76, 170, 204],
    [57, 61, 171, 180],  [61, 46, 172, 155],  [61, 41, 174, 149],  [63, 38, 175, 143], [60, 36, 176, 134],
    [56, 36, 177, 127],  [52, 37, 177, 123],  [46, 40, 177, 122],  [45, 42, 177, 121], [42, 45, 177, 122],
    [41, 49, 177, 125],  [42, 54, 177, 132],  [44, 59, 176, 139],  [48, 64, 176, 148], [54, 72, 175, 165],
    [59, 78, 174, 178],  [67, 86, 172, 196],  [72, 95, 170, 209],  [59, 115, 171, 208], [46, 133, 174, 208]
];

// ---- Torreta enemiga ----
// Cuadros de torreta.png: [x, ancho]. El 0 está quieto, 1-3 disparando.
var CUADROS_TORRETA = [[24, 242], [285, 340], [645, 340], [1000, 340]];
var ANCHO_CUADRO_TORRETA = 340;
var ALTO_CUADRO_TORRETA = 183;
var PIES_TORRETA = 170;        // donde toca el suelo dentro del cuadro
var CENTRO_TORRETA = 105;      // centro del soldado y la base (eje para voltearla)
var BOCA_CANON = [240, 78];    // punta del cañón dentro del cuadro
var ESCALA_TORRETA = 0.45;

var TORRETA = {
    x: 2250,              // al final del tercer tramo, antes del agua
    alcance: 560,         // empieza a disparar cuando el Ticayo está así de cerca
    cadencia: 1500,       // ms entre disparos
    velocidadBala: 380,
    vida: 3               // espadazos para destruirla
};

// ---- Formas del Ticayo ----
// caja = caja de choque en píxeles del cuadro original (256x256)
var FORMAS = {
    normal: {
        textura: 'ticayo-idle', escala: 0.55, anim: 'idle',
        caja: { ancho: 120, alto: 84, x: 95, y: 94 }      // sin la cola
    },
    // En el aire (solo sin poder). La caja mide lo mismo que la normal en pantalla.
    salto: {
        textura: 'ticayo-salto', escala: 0.62, anim: null,
        caja: { ancho: 106, alto: 74, x: 75, y: 91 }
    },
    guerrero: {
        textura: 'ticayo-power', escala: 0.5, anim: 'guerrero-idle',
        caja: { ancho: 80, alto: 166, x: 88, y: 70 }
    }
};

var VELOCIDAD = 230;
var FUERZA_SALTO = 620;

var config = {
    type: Phaser.AUTO,
    width: ANCHO,
    height: ALTO,
    physics: {
        default: 'arcade',
        arcade: {
            gravity: { y: 1300 },
            debug: false
        }
    },
    scene: {
        preload: preload,
        create: create,
        update: update
    }
};

var game = new Phaser.Game(config);

var rnd;          // números aleatorios con semilla (siempre el mismo dibujo)
var capas = [];   // capas de fondo con parallax
var aguas = [];   // superficies de agua animadas
var cursors;
var teclaSalto;
var teclaAtaque;
var teclaR;

var jugador;
var forma;              // FORMAS.normal o FORMAS.guerrero
var direccion = 1;      // 1 derecha, -1 izquierda
var espinas;            // grupo de arbustos de espinas (se pueden cortar)
var vidas = 3;
var textoVidas;
var textoCentro;
var textoPoder;
var barraPoder;
var chispas;
var invulnerable = false;
var muriendo = false;
var gameOver = false;
var ultimoEnSuelo = 0;
var poderHasta = 0;     // momento en que se acaba el poder (0 = sin poder)
var puntoInicio = { x: 110, y: SUELO_Y - 60 };
var enAireDesde = 0;    // momento en que dejó el suelo (0 = en el suelo)
var torreta;            // la torreta enemiga (null cuando se destruye)
var balas;              // balas de la torreta
var numeroAtaque = 0;   // cuenta los espadazos (cada uno golpea una sola vez)

function preload ()
{
    // 21 cuadros de 256x256 en una cuadrícula de 5x5
    this.load.spritesheet('ticayo-idle', 'assets/Ticayo_idle.png', { frameWidth: 256, frameHeight: 256, endFrame: 20 });
    // 25 cuadros de 256x256: 0-5 guardia, 6-24 ataque con espadas
    this.load.spritesheet('ticayo-power', 'assets/Ticayo_power.png', { frameWidth: 256, frameHeight: 256, endFrame: 24 });
    // Estas dos hojas tienen cuadros desparejos: se cargan como imagen y
    // los cuadros se arman a mano en crearCuadros()
    this.load.image('ticayo-salto-hoja', 'assets/Tilcayo_jump.png');
    this.load.image('torreta', 'assets/torreta.png');
}

function create ()
{
    rnd = new Phaser.Math.RandomDataGenerator(['selva-ticayo']);
    capas = [];
    aguas = [];
    invulnerable = false;
    muriendo = false;
    gameOver = false;
    poderHasta = 0;
    enAireDesde = 0;
    forma = undefined;

    if (!this.textures.exists('cielo'))
    {
        crearTexturas(this);
        crearCuadros(this);
    }

    // ---- Capas de fondo (de la más lejana a la más cercana) ----
    this.add.image(0, 0, 'cielo').setOrigin(0).setScrollFactor(0);
    agregarCapa(this, 'montanas', 0.1);
    agregarCapa(this, 'arboles-lejanos', 0.25);
    agregarCapa(this, 'arboles-grandes', 0.5);

    // Rayos de sol entre los árboles
    var rayos = this.add.image(0, 0, 'rayos').setOrigin(0).setScrollFactor(0).setBlendMode(Phaser.BlendModes.ADD);
    this.tweens.add({ targets: rayos, alpha: 0.5, duration: 3000, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });

    // ---- El nivel (se mueve junto con la cámara) ----
    this.add.image(0, 0, 'nivel').setOrigin(0);
    crearAgua(this);

    // ---- Físicas del nivel (cajas invisibles encima del dibujo) ----
    this.physics.world.setBounds(0, 0, ANCHO_NIVEL, ALTO);
    this.physics.world.setBoundsCollision(true, true, true, false);   // abajo abierto

    var solidos = this.physics.add.staticGroup();
    var ramas = this.physics.add.staticGroup();
    var charcos = this.physics.add.staticGroup();
    espinas = this.physics.add.staticGroup();

    TRAMOS_SUELO.forEach(function (t) {
        solidos.add(caja(this, t[0], SUELO_Y, t[1] - t[0], ALTO - SUELO_Y));
    }, this);

    RAMAS.forEach(function (r) {
        var rama = caja(this, r[0], r[1] - 2, r[2], 16);
        ramas.add(rama);
        // Solo chocan por arriba: se pueden atravesar saltando desde abajo
        rama.body.checkCollision.down = false;
        rama.body.checkCollision.left = false;
        rama.body.checkCollision.right = false;
    }, this);

    OBSTACULOS.forEach(function (o) {
        var t = CAJAS_OBSTACULO[o.tipo];
        var c = caja(this, o.x - t[0] / 2, SUELO_Y - t[1], t[0], t[1]);
        if (o.tipo === 'espinas')
        {
            // Las espinas son una imagen aparte para poder cortarlas
            c.dibujo = this.add.image(o.x, SUELO_Y + 4, 'espinas').setOrigin(0.5, 1);
            espinas.add(c);
        }
        else
        {
            solidos.add(c);
        }
    }, this);

    for (var i = 0; i < TRAMOS_SUELO.length - 1; i++)
    {
        var x1 = TRAMOS_SUELO[i][1];
        var x2 = TRAMOS_SUELO[i + 1][0];
        charcos.add(caja(this, x1, AGUA_Y + 15, x2 - x1, ALTO - AGUA_Y));
    }

    // ---- Carnes de poder ----
    var carnes = this.physics.add.staticGroup();
    CARNES.forEach(function (c) {
        var brillo = this.add.image(c[1], c[2], 'luz').setScale(4).setBlendMode(Phaser.BlendModes.ADD).setAlpha(0.6);
        var carne = carnes.create(c[1], c[2], c[0]);
        carne.brillo = brillo;
        // Flota y brilla
        this.tweens.add({ targets: [carne, brillo], y: c[2] - 8, duration: 900, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
        this.tweens.add({ targets: brillo, alpha: 0.25, scale: 3, duration: 700, yoyo: true, repeat: -1 });
    }, this);

    // ---- Animaciones ----
    if (!this.anims.exists('idle'))
    {
        this.anims.create({
            key: 'idle',
            frames: this.anims.generateFrameNumbers('ticayo-idle', { start: 0, end: 20 }),
            frameRate: 12,
            repeat: -1
        });
        this.anims.create({
            key: 'guerrero-idle',
            frames: this.anims.generateFrameNumbers('ticayo-power', { start: 0, end: 5 }),
            frameRate: 8,
            yoyo: true,
            repeat: -1
        });
        this.anims.create({
            key: 'ataque',
            frames: this.anims.generateFrameNumbers('ticayo-power', { start: 6, end: 24 }),
            frameRate: 32
        });
        this.anims.create({
            key: 'torreta-disparo',
            frames: [1, 2, 3, 0].map(function (n) { return { key: 'torreta', frame: 'f' + n }; }),
            frameRate: 18
        });
    }

    // ---- Torreta (antes del Ticayo para que quede detrás de él) ----
    crearTorreta(this);

    // ---- Ticayo ----
    jugador = this.physics.add.sprite(puntoInicio.x, puntoInicio.y, 'ticayo-idle');
    jugador.setCollideWorldBounds(true);
    ponerForma(jugador, FORMAS.normal);

    torreta.colisor = this.physics.add.collider(jugador, torreta.caja);

    this.physics.add.collider(jugador, solidos);
    this.physics.add.collider(jugador, ramas);
    this.physics.add.overlap(jugador, espinas, tocarEspinas, null, this);
    this.physics.add.overlap(jugador, charcos, caerAlAgua, null, this);
    this.physics.add.overlap(jugador, carnes, comerCarne, null, this);

    // Balas de la torreta: se rompen contra el suelo y los obstáculos
    balas = this.physics.add.group({ allowGravity: false });
    this.physics.add.collider(balas, solidos, romperBala, null, this);
    this.physics.add.overlap(jugador, balas, tocarBala, null, this);

    // Chispas para efectos (comer, cortar espinas)
    chispas = this.add.particles(0, 0, 'luz', {
        speed: { min: 80, max: 260 },
        lifespan: 600,
        scale: { start: 1.2, end: 0 },
        blendMode: 'ADD',
        emitting: false
    });

    // Luciérnagas
    this.add.particles(0, 0, 'luz', {
        x: { min: 0, max: ANCHO_NIVEL },
        y: { min: 150, max: 500 },
        lifespan: 4000,
        speedX: { min: -15, max: 15 },
        speedY: { min: -15, max: 10 },
        scale: { start: 0.7, end: 0 },
        alpha: { start: 1, end: 0 },
        frequency: 90,
        blendMode: 'ADD'
    });

    // ---- Primer plano: helechos y hojas colgantes (van más rápido que la cámara) ----
    agregarCapa(this, 'follaje-frente', 1.3);

    // Hojas que caen
    this.add.particles(0, 0, 'hoja', {
        x: { min: 0, max: ANCHO },
        y: -10,
        lifespan: 14000,
        speedY: { min: 25, max: 55 },
        speedX: { min: -35, max: 35 },
        rotate: { start: 0, end: 540 },
        scale: { min: 0.8, max: 1.4 },
        frequency: 700
    }).setScrollFactor(0);

    // Viñeta (oscurece los bordes, da look más "pro")
    this.add.image(0, 0, 'vineta').setOrigin(0).setScrollFactor(0);

    // ---- Cámara ----
    this.cameras.main.setBounds(0, 0, ANCHO_NIVEL, ALTO);
    this.cameras.main.startFollow(jugador, true, 0.12, 0.12);
    this.cameras.main.setDeadzone(100, 120);

    // ---- Controles ----
    cursors = this.input.keyboard.createCursorKeys();
    teclaSalto = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
    teclaAtaque = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.X);
    teclaR = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.R);

    // ---- HUD ----
    var estilo = { fontSize: '22px', fontStyle: 'bold', color: '#ffffff', stroke: '#000000', strokeThickness: 5 };
    textoVidas = this.add.text(16, 16, '', estilo).setScrollFactor(0);
    textoPoder = this.add.text(16, 48, '', { fontSize: '18px', fontStyle: 'bold', color: '#ffd166', stroke: '#000000', strokeThickness: 5 }).setScrollFactor(0);
    barraPoder = this.add.graphics().setScrollFactor(0);
    textoCentro = this.add.text(ANCHO / 2, ALTO / 2, '', { fontSize: '40px', fontStyle: 'bold', color: '#ffffff', stroke: '#000000', strokeThickness: 7, align: 'center' })
        .setOrigin(0.5).setScrollFactor(0);
    actualizarHUD();
}

function update (time)
{
    var cam = this.cameras.main;

    // Parallax: cada capa se mueve a su propia velocidad
    capas.forEach(function (capa) {
        capa.sprite.tilePositionX = cam.scrollX * capa.factor;
    });

    // Olas del agua
    aguas.forEach(function (agua) {
        agua.claro.tilePositionX += 0.4;
        agua.oscuro.tilePositionX -= 0.25;
    });

    if (gameOver)
    {
        if (Phaser.Input.Keyboard.JustDown(teclaR))
        {
            vidas = 3;
            this.scene.restart();
        }
        return;
    }

    if (muriendo)
    {
        return;
    }

    // ---- Tiempo del poder ----
    if (poderHasta > 0)
    {
        var restante = poderHasta - time;
        if (restante <= 0)
        {
            quitarPoder(this);
        }
        else
        {
            dibujarBarraPoder(restante);
            // Parpadea en los últimos 5 segundos para avisar
            if (!invulnerable)
            {
                jugador.setAlpha(restante < 5000 && Math.floor(time / 120) % 2 === 0 ? 0.5 : 1);
            }
        }
    }

    var enSuelo = jugador.body.blocked.down || jugador.body.touching.down;
    if (enSuelo)
    {
        ultimoEnSuelo = time;
    }

    // Caminar
    if (cursors.left.isDown)
    {
        jugador.setVelocityX(-VELOCIDAD);
        mirarA(jugador, -1);
    }
    else if (cursors.right.isDown)
    {
        jugador.setVelocityX(VELOCIDAD);
        mirarA(jugador, 1);
    }
    else
    {
        jugador.setVelocityX(0);
    }

    // Saltar (con 100 ms de margen al salir de un borde)
    var saltar = Phaser.Input.Keyboard.JustDown(cursors.up) || Phaser.Input.Keyboard.JustDown(teclaSalto);
    if (saltar && time - ultimoEnSuelo < 100)
    {
        jugador.setVelocityY(-FUERZA_SALTO);
        ultimoEnSuelo = 0;
    }

    // Salto variable: si suelta el botón antes, salta más bajo
    if (!cursors.up.isDown && !teclaSalto.isDown && jugador.body.velocity.y < -250)
    {
        jugador.setVelocityY(-250);
    }

    // ---- Forma de salto (solo sin poder) ----
    if (enSuelo)
    {
        enAireDesde = 0;
    }
    else if (enAireDesde === 0)
    {
        enAireDesde = time;
    }

    if (forma !== FORMAS.guerrero)
    {
        // Saltó, o lleva un ratito cayendo (así no parpadea en los bordes)
        var enAire = !enSuelo && (jugador.body.velocity.y < 0 || time - enAireDesde > 80);
        if (enAire && forma !== FORMAS.salto)
        {
            ponerForma(jugador, FORMAS.salto);
        }
        else if (!enAire && forma === FORMAS.salto)
        {
            ponerForma(jugador, FORMAS.normal);
        }

        if (forma === FORMAS.salto)
        {
            jugador.setFrame(cuadroSalto(jugador.body.velocity.y));
        }
    }

    // ---- Torreta y balas ----
    actualizarTorreta(this, time);
    balas.getChildren().slice().forEach(function (b) {
        if (b.x < cam.scrollX - 50 || b.x > cam.scrollX + ANCHO + 50)
        {
            b.destroy();
        }
    });

    // ---- Ataque (solo con poder) ----
    var atacando = jugador.anims.isPlaying && jugador.anims.currentAnim.key === 'ataque';
    if (forma === FORMAS.guerrero && !atacando && Phaser.Input.Keyboard.JustDown(teclaAtaque))
    {
        jugador.anims.play('ataque');
        numeroAtaque++;
        atacando = true;
    }

    if (atacando)
    {
        // Los cuadros 12-19 son el golpe de espada
        var cuadro = jugador.anims.currentFrame.index + 5;
        if (cuadro >= 12 && cuadro <= 19)
        {
            golpearEspinas(this);
            golpearTorreta(this);
        }
    }
    else if (forma.anim)
    {
        jugador.anims.play(forma.anim, true);
    }
}

// Elige el cuadro del salto según la velocidad vertical:
// 4-11 subiendo (se estira), 12-19 bajando (se prepara para caer)
function cuadroSalto (vy)
{
    var t;
    if (vy < 0)
    {
        t = Phaser.Math.Clamp(1 + vy / FUERZA_SALTO, 0, 1);
        return 4 + Math.round(t * 7);
    }
    t = Phaser.Math.Clamp(vy / 700, 0, 1);
    return 12 + Math.round(t * 7);
}

// Caja invisible con cuerpo físico estático
function caja (scene, x, y, w, h)
{
    var z = scene.add.zone(x + w / 2, y + h / 2, w, h);
    scene.physics.add.existing(z, true);
    return z;
}

// Cambia la forma del Ticayo (normal o guerrero) sin moverle los pies
function ponerForma (sprite, nueva)
{
    var pies = sprite.body.bottom;
    var cambio = forma !== undefined && forma !== nueva;

    forma = nueva;
    sprite.setTexture(nueva.textura, 0);
    sprite.setScale(nueva.escala);
    sprite.body.setSize(nueva.caja.ancho, nueva.caja.alto, false);
    mirarA(sprite, direccion);
    if (nueva.anim)
    {
        sprite.anims.play(nueva.anim);
    }
    else
    {
        sprite.anims.stop();   // el salto elige su cuadro según la velocidad
    }

    if (cambio)
    {
        // El centro del cuadro está en 128: pone los pies donde estaban
        // (y conserva la velocidad, para poder cambiar de forma en el aire)
        var vx = sprite.body.velocity.x;
        var vy = sprite.body.velocity.y;
        sprite.y = pies - (nueva.caja.y + nueva.caja.alto - 128) * nueva.escala;
        sprite.body.reset(sprite.x, sprite.y);
        sprite.setVelocity(vx, vy);
    }
}

// Voltea al Ticayo y acomoda su caja de choque
function mirarA (sprite, dir)
{
    direccion = dir;
    sprite.setFlipX(dir < 0);
    var c = forma.caja;
    var offsetX = dir < 0 ? 256 - c.x - c.ancho : c.x;
    sprite.body.setOffset(offsetX, c.y);
}

function comerCarne (j, carne)
{
    if (muriendo || gameOver)
    {
        return;
    }

    chispas.explode(20, carne.x, carne.y);
    carne.brillo.destroy();
    this.tweens.killTweensOf(carne);
    carne.destroy();

    activarPoder(this);
}

function activarPoder (scene)
{
    var yaTenia = poderHasta > 0;
    poderHasta = scene.time.now + DURACION_PODER;

    if (yaTenia)
    {
        mostrarAviso(scene, '+30 s', '#ffd166');
        return;
    }

    ponerForma(jugador, FORMAS.guerrero);
    scene.cameras.main.flash(250, 255, 220, 150);
    scene.cameras.main.shake(200, 0.006);
    mostrarAviso(scene, '¡PODER DE ATAQUE!\nX para atacar', '#ffd166');
}

function quitarPoder (scene)
{
    poderHasta = 0;
    barraPoder.clear();
    textoPoder.setText('');
    jugador.setAlpha(1);
    if (forma === FORMAS.guerrero)
    {
        ponerForma(jugador, FORMAS.normal);
        chispas.explode(12, jugador.x, jugador.y);
    }
}

// Rectángulo que alcanza la espada, delante del Ticayo
function zonaEspada ()
{
    var b = jugador.body;
    var alcance = 70;
    return new Phaser.Geom.Rectangle(
        direccion > 0 ? b.right - 10 : b.left - alcance + 10,
        b.top + 20,
        alcance,
        b.height - 20
    );
}

// Revisa si la espada toca algún arbusto de espinas y lo corta
function golpearEspinas (scene)
{
    var zona = zonaEspada();

    espinas.getChildren().slice().forEach(function (e) {
        if (Phaser.Geom.Intersects.RectangleToRectangle(zona, e.getBounds()))
        {
            chispas.explode(16, e.x, e.y);
            scene.tweens.add({
                targets: e.dibujo, scaleY: 0, alpha: 0, duration: 250,
                onComplete: function (tween, targets) { targets[0].destroy(); }
            });
            e.destroy();
        }
    });
}

function mostrarAviso (scene, texto, color)
{
    var aviso = scene.add.text(ANCHO / 2, 140, texto, {
        fontSize: '34px', fontStyle: 'bold', color: color, stroke: '#000000', strokeThickness: 7, align: 'center'
    }).setOrigin(0.5).setScrollFactor(0).setScale(0.3);

    scene.tweens.add({ targets: aviso, scale: 1, duration: 250, ease: 'Back.easeOut' });
    scene.tweens.add({ targets: aviso, alpha: 0, y: 110, delay: 1400, duration: 500, onComplete: function () { aviso.destroy(); } });
}

function dibujarBarraPoder (restante)
{
    var ancho = 180;
    var parte = restante / DURACION_PODER;
    textoPoder.setText('PODER ' + Math.ceil(restante / 1000) + ' s');
    barraPoder.clear();
    barraPoder.fillStyle(0x000000, 0.6);
    barraPoder.fillRoundedRect(14, 72, ancho + 4, 14, 5);
    barraPoder.fillStyle(parte < 0.17 ? 0xff5a36 : 0xffb703, 1);
    barraPoder.fillRoundedRect(16, 74, ancho * parte, 10, 4);
}

function perderVida (scene)
{
    vidas--;
    actualizarHUD();
    if (vidas <= 0)
    {
        gameOver = true;
        scene.physics.pause();
        jugador.anims.stop();
        jugador.setTint(0xff6666);
        textoCentro.setText('GAME OVER\nPresiona R para reiniciar');
        return false;
    }
    return true;
}

function tocarEspinas (j, espina)
{
    herir(this, espina.x);
}

// El Ticayo recibe un golpe que viene desde la posición desdeX
function herir (scene, desdeX)
{
    if (invulnerable || muriendo || gameOver)
    {
        return;
    }

    // Con poder: pierde el poder en vez de una vida (como Mario)
    if (poderHasta > 0)
    {
        quitarPoder(scene);
    }
    else if (!perderVida(scene))
    {
        return;
    }

    // Empujón hacia atrás y parpadeo
    invulnerable = true;
    var dir = jugador.x < desdeX ? -1 : 1;
    jugador.setVelocity(dir * 260, -380);
    jugador.setTint(0xff6666);
    scene.tweens.add({ targets: jugador, alpha: 0.3, duration: 100, yoyo: true, repeat: 7 });
    scene.time.delayedCall(1600, function () {
        invulnerable = false;
        jugador.clearTint().setAlpha(1);
    });
}

// =====================================================
//  TORRETA
// =====================================================

function crearTorreta (scene)
{
    var sprite = scene.add.sprite(TORRETA.x, SUELO_Y + 2, 'torreta', 'f0').setScale(ESCALA_TORRETA);

    // Caja de choque: el soldado con la base (sin el cañón que sobresale)
    var ancho = 190 * ESCALA_TORRETA;
    var alto = (PIES_TORRETA - 40) * ESCALA_TORRETA;
    var cajaTorreta = caja(scene, TORRETA.x - ancho / 2, SUELO_Y - alto, ancho, alto);

    torreta = {
        sprite: sprite,
        caja: cajaTorreta,
        vida: TORRETA.vida,
        dir: -1,
        proximoDisparo: 0,
        ultimoGolpe: -1,
        colisor: null
    };
    mirarTorreta(-1);
}

// Voltea la torreta sobre el eje del soldado
function mirarTorreta (dir)
{
    torreta.dir = dir;
    torreta.sprite.setFlipX(dir < 0);
    var centro = dir < 0 ? ANCHO_CUADRO_TORRETA - CENTRO_TORRETA : CENTRO_TORRETA;
    torreta.sprite.setOrigin(centro / ANCHO_CUADRO_TORRETA, PIES_TORRETA / ALTO_CUADRO_TORRETA);
}

function actualizarTorreta (scene, time)
{
    if (!torreta)
    {
        return;
    }

    var distancia = jugador.x - TORRETA.x;
    if (Math.abs(distancia) > TORRETA.alcance || muriendo)
    {
        // Fuera de alcance: al entrar espera un momento antes del primer disparo
        torreta.proximoDisparo = time + 600;
        return;
    }

    mirarTorreta(distancia < 0 ? -1 : 1);

    if (time >= torreta.proximoDisparo)
    {
        torreta.proximoDisparo = time + TORRETA.cadencia;
        dispararTorreta(scene);
    }
}

function dispararTorreta (scene)
{
    torreta.sprite.anims.play('torreta-disparo');

    // La boca del cañón, pasada a coordenadas del mundo
    var bx = TORRETA.x + (BOCA_CANON[0] - CENTRO_TORRETA) * ESCALA_TORRETA * torreta.dir;
    var by = SUELO_Y + 2 - (PIES_TORRETA - BOCA_CANON[1]) * ESCALA_TORRETA;

    var bala = balas.create(bx, by, 'bala');
    bala.setFlipX(torreta.dir < 0);
    bala.body.setSize(14, 6);
    bala.setVelocityX(TORRETA.velocidadBala * torreta.dir);
}

function romperBala (bala)
{
    chispas.explode(6, bala.x, bala.y);
    bala.destroy();
}

function tocarBala (j, bala)
{
    var desde = bala.x - bala.body.velocity.x;   // de dónde venía
    romperBala(bala);
    herir(this, desde);
}

// Revisa si la espada le pega a la torreta (una vez por espadazo)
function golpearTorreta (scene)
{
    if (!torreta || torreta.ultimoGolpe === numeroAtaque)
    {
        return;
    }
    if (!Phaser.Geom.Intersects.RectangleToRectangle(zonaEspada(), torreta.caja.getBounds()))
    {
        return;
    }

    torreta.ultimoGolpe = numeroAtaque;
    torreta.vida--;
    chispas.explode(14, torreta.caja.x, torreta.caja.y);
    scene.cameras.main.shake(120, 0.005);

    if (torreta.vida > 0)
    {
        torreta.sprite.setTintFill(0xffffff);
        scene.time.delayedCall(90, function () {
            if (torreta) torreta.sprite.clearTint();
        });
        return;
    }

    // Destruida
    var t = torreta;
    torreta = null;
    t.colisor.destroy();
    t.caja.destroy();
    chispas.explode(40, t.sprite.x, t.sprite.y - 40);
    scene.cameras.main.flash(200, 255, 200, 120);
    t.sprite.anims.stop();
    t.sprite.setTint(0x555555);
    scene.tweens.add({
        targets: t.sprite, alpha: 0, angle: 12 * -t.dir, y: t.sprite.y + 10, duration: 700,
        onComplete: function () { t.sprite.destroy(); }
    });
    mostrarAviso(scene, '¡TORRETA DESTRUIDA!', '#7ee081');
}

function caerAlAgua ()
{
    if (muriendo || gameOver)
    {
        return;
    }
    muriendo = true;

    if (poderHasta > 0)
    {
        quitarPoder(this);
    }

    jugador.setVelocity(0, 0);
    jugador.body.allowGravity = false;
    jugador.setTint(0x6fa8ff);
    this.tweens.add({ targets: jugador, y: jugador.y + 25, alpha: 0.3, duration: 600 });

    if (!perderVida(this))
    {
        return;
    }

    this.time.delayedCall(900, function () {
        jugador.clearTint().setAlpha(1).setPosition(puntoInicio.x, puntoInicio.y);
        jugador.body.allowGravity = true;
        mirarA(jugador, 1);
        muriendo = false;
    });
}

function actualizarHUD ()
{
    textoVidas.setText('Vidas: ' + '♥ '.repeat(Math.max(vidas, 0)));
}

function agregarCapa (scene, clave, factor)
{
    var sprite = scene.add.tileSprite(0, 0, ANCHO, ALTO, clave).setOrigin(0).setScrollFactor(0);
    capas.push({ sprite: sprite, factor: factor });
}

function crearAgua (scene)
{
    for (var i = 0; i < TRAMOS_SUELO.length - 1; i++)
    {
        var x1 = TRAMOS_SUELO[i][1];
        var x2 = TRAMOS_SUELO[i + 1][0];
        var ancho = x2 - x1;

        // Dos capas de olas que se mueven en sentidos contrarios
        var oscuro = scene.add.tileSprite(x1, AGUA_Y + 6, ancho, 12, 'ola-oscura').setOrigin(0);
        var claro = scene.add.tileSprite(x1, AGUA_Y - 3, ancho, 12, 'ola').setOrigin(0);
        aguas.push({ claro: claro, oscuro: oscuro });

        // Brillos que aparecen y desaparecen
        for (var b = 0; b < ancho / 25; b++)
        {
            var brillo = scene.add.rectangle(x1 + rnd.between(10, ancho - 10), rnd.between(AGUA_Y + 4, ALTO - 20), rnd.between(6, 16), 2, 0xffffff, 0);
            scene.tweens.add({
                targets: brillo, fillAlpha: 0.6, duration: rnd.between(600, 1400),
                yoyo: true, repeat: -1, delay: rnd.between(0, 3000), repeatDelay: rnd.between(500, 2500)
            });
        }

        // Nenúfares flotando
        for (var n = 0; n < ancho / 60; n++)
        {
            var nenufar = scene.add.image(x1 + 25 + n * 60 + rnd.between(-10, 10), AGUA_Y + 2, rnd.frac() < 0.3 ? 'nenufar-flor' : 'nenufar');
            scene.tweens.add({ targets: nenufar, y: AGUA_Y + 5, angle: rnd.between(-4, 4), duration: rnd.between(1400, 2200), yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
        }
    }
}

// =====================================================
//  DIBUJO DE TEXTURAS
// =====================================================

function lienzo (scene, clave, w, h, dibujar)
{
    var tex = scene.textures.createCanvas(clave, w, h);
    dibujar(tex.getContext(), w, h);
    tex.refresh();
}

function circulo (ctx, x, y, r)
{
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
}

function elipse (ctx, x, y, rx, ry, ang)
{
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, ang || 0, 0, Math.PI * 2);
    ctx.fill();
}

// Dibuja algo 3 veces (x, x-w, x+w) para que la capa se repita sin cortes
function repetir (w, x, fn)
{
    fn(x - w);
    fn(x);
    fn(x + w);
}

// Copa de árbol: montón de círculos con 3 tonos (sombra, medio, luz)
function copa (ctx, cx, cy, r, colores)
{
    var i;
    ctx.fillStyle = colores[0];
    for (i = 0; i < 16; i++) circulo(ctx, cx + rnd.realInRange(-r, r), cy + rnd.realInRange(-r * 0.35, r * 0.5), rnd.realInRange(r * 0.35, r * 0.6));
    ctx.fillStyle = colores[1];
    for (i = 0; i < 11; i++) circulo(ctx, cx + rnd.realInRange(-r * 0.85, r * 0.7), cy + rnd.realInRange(-r * 0.5, r * 0.2), rnd.realInRange(r * 0.25, r * 0.45));
    ctx.fillStyle = colores[2];
    for (i = 0; i < 7; i++) circulo(ctx, cx + rnd.realInRange(-r * 0.7, r * 0.3), cy + rnd.realInRange(-r * 0.6, -r * 0.1), rnd.realInRange(r * 0.12, r * 0.25));
}

// Tronco con sombreado, corteza y raíces tabulares (típicas de la selva)
function tronco (ctx, x, yArriba, yBase, w, oscuro, claro)
{
    var grad = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
    grad.addColorStop(0, oscuro);
    grad.addColorStop(0.65, claro);
    grad.addColorStop(1, oscuro);
    ctx.fillStyle = grad;

    ctx.beginPath();
    ctx.moveTo(x - w * 0.4, yArriba);
    ctx.lineTo(x + w * 0.4, yArriba);
    ctx.lineTo(x + w * 0.5, yBase);
    ctx.lineTo(x - w * 0.5, yBase);
    ctx.closePath();
    ctx.fill();

    // Raíces
    [-1, 1].forEach(function (lado) {
        for (var k = 0; k < 2; k++)
        {
            var alto = w * (k === 0 ? 1.1 : 0.6);
            var largo = w * (k === 0 ? 1.1 : 1.6);
            ctx.beginPath();
            ctx.moveTo(x + lado * w * 0.2, yBase - alto);
            ctx.quadraticCurveTo(x + lado * w * 0.45, yBase - alto * 0.2, x + lado * largo, yBase);
            ctx.lineTo(x + lado * w * 0.1, yBase);
            ctx.closePath();
            ctx.fill();
        }
    });

    // Líneas de corteza
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 2;
    for (var k = 0; k < 6; k++)
    {
        var xx = x - w * 0.32 + k * w * 0.13;
        ctx.beginPath();
        ctx.moveTo(xx, yArriba);
        for (var y = yArriba; y < yBase; y += 18) ctx.lineTo(xx + rnd.realInRange(-2.5, 2.5), y);
        ctx.stroke();
    }

    // Musgo
    ctx.fillStyle = 'rgba(90,150,60,0.35)';
    for (var m = 0; m < 5; m++) elipse(ctx, x + rnd.realInRange(-w * 0.35, w * 0.2), rnd.realInRange(yArriba + 40, yBase - 20), rnd.realInRange(6, 14), rnd.realInRange(10, 25));
}

// Liana colgando con hojitas
function liana (ctx, x, largo, curva, color, colorHoja)
{
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x, -10);
    ctx.bezierCurveTo(x + curva, largo * 0.3, x - curva, largo * 0.7, x + curva * 0.3, largo);
    ctx.stroke();

    ctx.fillStyle = colorHoja;
    for (var t = 0.1; t < 1; t += 0.09)
    {
        var px = bezier(x, x + curva, x - curva, x + curva * 0.3, t);
        var py = bezier(-10, largo * 0.3, largo * 0.7, largo, t);
        elipse(ctx, px + 5, py, 6, 3, 0.6);
        elipse(ctx, px - 5, py + 4, 6, 3, -0.6);
    }
}

function bezier (a, b, c, d, t)
{
    var u = 1 - t;
    return u * u * u * a + 3 * u * u * t * b + 3 * u * t * t * c + t * t * t * d;
}

function crearTexturas (scene)
{
    // ---------- Cielo ----------
    lienzo(scene, 'cielo', ANCHO, ALTO, function (ctx, w, h) {
        var g = ctx.createLinearGradient(0, 0, 0, h);
        g.addColorStop(0, '#5fa9c2');
        g.addColorStop(0.45, '#b9e0cf');
        g.addColorStop(0.75, '#f3e6b0');
        g.addColorStop(1, '#f7d98e');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);

        // Resplandor del sol
        var sol = ctx.createRadialGradient(560, 170, 10, 560, 170, 260);
        sol.addColorStop(0, 'rgba(255,250,220,1)');
        sol.addColorStop(0.15, 'rgba(255,240,190,0.8)');
        sol.addColorStop(1, 'rgba(255,240,190,0)');
        ctx.fillStyle = sol;
        ctx.fillRect(0, 0, w, h);
    });

    // ---------- Montañas lejanas con neblina ----------
    lienzo(scene, 'montanas', 1024, ALTO, function (ctx, w, h) {
        var cordillera = function (base, amp, color, fase) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(0, h);
            for (var x = 0; x <= w; x += 8)
            {
                var a = (x / w) * Math.PI * 2;
                ctx.lineTo(x, base - amp * (0.55 * Math.sin(a * 2 + fase) + 0.3 * Math.sin(a * 5 + fase * 2) + 0.15 * Math.sin(a * 11)));
            }
            ctx.lineTo(w, h);
            ctx.closePath();
            ctx.fill();
        };
        cordillera(300, 90, '#8dbfb2', 0.5);
        cordillera(350, 60, '#74aa9a', 2.1);

        var niebla = ctx.createLinearGradient(0, 260, 0, 420);
        niebla.addColorStop(0, 'rgba(225,240,225,0)');
        niebla.addColorStop(1, 'rgba(225,240,225,0.85)');
        ctx.fillStyle = niebla;
        ctx.fillRect(0, 260, w, h - 260);
    });

    // ---------- Selva lejana ----------
    lienzo(scene, 'arboles-lejanos', 1024, ALTO, function (ctx, w, h) {
        for (var x = 0; x < w; x += 55)
        {
            var px = x + rnd.between(-15, 15);
            var alto = rnd.between(330, 390);
            repetir(w, px, function (xx) {
                ctx.fillStyle = '#4f7d69';
                ctx.fillRect(xx - 4, alto, 8, h - alto);
            });
            var s = rnd.state();
            repetir(w, px, function (xx) {
                rnd.state(s);
                copa(ctx, xx, alto, rnd.between(38, 55), ['#4c8a6f', '#5c9a7e', '#70ab8e']);
            });
        }
        ctx.fillStyle = '#4c8a6f';
        ctx.fillRect(0, 370, w, h - 370);

        var niebla = ctx.createLinearGradient(0, 300, 0, h);
        niebla.addColorStop(0, 'rgba(210,235,220,0.15)');
        niebla.addColorStop(1, 'rgba(210,235,220,0.7)');
        ctx.fillStyle = niebla;
        ctx.fillRect(0, 300, w, h - 300);
    });

    // ---------- Árboles gigantes de fondo ----------
    lienzo(scene, 'arboles-grandes', 1600, ALTO, function (ctx, w, h) {
        var colHojas = ['#1d4f33', '#276b42', '#3a8a52'];
        var posiciones = [120, 520, 900, 1330];

        // Arbustos al pie de los árboles
        for (var x = 0; x < w; x += 40)
        {
            var s = rnd.state();
            repetir(w, x, function (xx) {
                rnd.state(s);
                copa(ctx, xx, h - 20, rnd.between(28, 40), ['#1f4a30', '#2a5f3c', '#357048']);
            });
        }

        posiciones.forEach(function (px) {
            var anchoT = rnd.between(70, 110);
            var s = rnd.state();
            repetir(w, px, function (xx) {
                rnd.state(s);
                tronco(ctx, xx, 0, h - 10, anchoT, '#2a1d14', '#5a3f2a');

                // Ramas laterales con su copa
                ctx.strokeStyle = '#3a2a1c';
                ctx.lineCap = 'round';
                [-1, 1].forEach(function (lado) {
                    var yR = rnd.between(120, 220);
                    ctx.lineWidth = anchoT * 0.22;
                    ctx.beginPath();
                    ctx.moveTo(xx, yR + 60);
                    ctx.quadraticCurveTo(xx + lado * 60, yR + 20, xx + lado * 140, yR);
                    ctx.stroke();
                    copa(ctx, xx + lado * 150, yR - 10, 55, colHojas);
                });

                // Copa gigante arriba
                copa(ctx, xx, 20, 150, colHojas);
            });
        });

        // Lianas
        for (var l = 0; l < 14; l++)
        {
            var lx = rnd.between(0, w);
            var largo = rnd.between(150, 380);
            var curva = rnd.between(-30, 30);
            repetir(w, lx, function (xx) {
                liana(ctx, xx, largo, curva, '#2c4a22', '#3f7a38');
            });
        }

        // Neblina baja
        var niebla = ctx.createLinearGradient(0, 380, 0, h);
        niebla.addColorStop(0, 'rgba(200,230,210,0)');
        niebla.addColorStop(1, 'rgba(200,230,210,0.35)');
        ctx.fillStyle = niebla;
        ctx.fillRect(0, 380, w, h - 380);
    });

    // ---------- Rayos de sol ----------
    lienzo(scene, 'rayos', ANCHO, ALTO, function (ctx, w, h) {
        var rayos = [[380, 60, 180], [520, 40, 120], [640, 90, 220], [760, 50, 140]];
        rayos.forEach(function (r) {
            var g = ctx.createLinearGradient(0, 0, 0, h);
            g.addColorStop(0, 'rgba(255,245,200,0.18)');
            g.addColorStop(1, 'rgba(255,245,200,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.moveTo(r[0], 0);
            ctx.lineTo(r[0] + r[1], 0);
            ctx.lineTo(r[0] + r[1] - 260, h);
            ctx.lineTo(r[0] - r[2] - 260, h);
            ctx.closePath();
            ctx.fill();
        });
    });

    // ---------- El nivel completo ----------
    lienzo(scene, 'nivel', ANCHO_NIVEL, ALTO, dibujarNivel);

    // ---------- Primer plano ----------
    lienzo(scene, 'follaje-frente', 1400, ALTO, function (ctx, w, h) {
        // Hojas que cuelgan arriba
        for (var i = 0; i < 9; i++)
        {
            var x = rnd.between(0, w);
            var largo = rnd.between(40, 120);
            repetir(w, x, function (xx) {
                ctx.fillStyle = 'rgba(10,35,20,0.92)';
                for (var k = 0; k < 7; k++) elipse(ctx, xx + (k - 3) * 14, largo * (1 - Math.abs(k - 3) / 4), 10, 28, (k - 3) * 0.25);
            });
        }
        // Helechos abajo
        for (var j = 0; j < 7; j++)
        {
            var fx = rnd.between(0, w);
            repetir(w, fx, function (xx) {
                ctx.fillStyle = 'rgba(12,40,22,0.95)';
                for (var k = -4; k <= 4; k++)
                {
                    var ang = k * 0.28;
                    var lx = xx + Math.sin(ang) * 50;
                    var ly = h - Math.cos(ang) * 55;
                    elipse(ctx, (xx + lx) / 2, (h + ly) / 2 + 10, 8, 38, ang);
                }
            });
        }
    });

    // ---------- Viñeta ----------
    lienzo(scene, 'vineta', ANCHO, ALTO, function (ctx, w, h) {
        var g = ctx.createRadialGradient(w / 2, h / 2, h * 0.35, w / 2, h / 2, h * 0.95);
        g.addColorStop(0, 'rgba(0,0,0,0)');
        g.addColorStop(1, 'rgba(0,15,5,0.55)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);
    });

    // ---------- Pequeñas texturas ----------
    lienzo(scene, 'luz', 16, 16, function (ctx) {
        var g = ctx.createRadialGradient(8, 8, 0, 8, 8, 8);
        g.addColorStop(0, 'rgba(255,255,200,1)');
        g.addColorStop(0.3, 'rgba(230,255,120,0.8)');
        g.addColorStop(1, 'rgba(200,255,100,0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 16, 16);
    });

    lienzo(scene, 'hoja', 12, 7, function (ctx) {
        ctx.fillStyle = '#4f9a3a';
        elipse(ctx, 6, 3.5, 6, 3);
        ctx.strokeStyle = '#2f6a22';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(0, 3.5); ctx.lineTo(12, 3.5); ctx.stroke();
    });

    lienzo(scene, 'ola', 64, 12, function (ctx) {
        ctx.strokeStyle = 'rgba(210,245,255,0.8)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (var x = 0; x <= 64; x += 2) ctx.lineTo(x, 6 + Math.sin(x / 64 * Math.PI * 2) * 3);
        ctx.stroke();
    });

    lienzo(scene, 'ola-oscura', 48, 12, function (ctx) {
        ctx.strokeStyle = 'rgba(20,80,110,0.6)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (var x = 0; x <= 48; x += 2) ctx.lineTo(x, 6 + Math.sin(x / 48 * Math.PI * 2) * 3);
        ctx.stroke();
    });

    var dibujarNenufar = function (flor) {
        return function (ctx) {
            ctx.fillStyle = '#3f8f3a';
            ctx.beginPath();
            ctx.ellipse(16, 8, 15, 6, 0, 0.35, Math.PI * 2 - 0.1);
            ctx.lineTo(16, 8);
            ctx.fill();
            ctx.fillStyle = '#5fb04f';
            elipse(ctx, 12, 7, 6, 2);
            if (flor)
            {
                ctx.fillStyle = '#f5a3c7';
                for (var p = 0; p < 5; p++) elipse(ctx, 18 + Math.cos(p * 1.25) * 3, 4 + Math.sin(p * 1.25) * 1.5, 3, 2, p * 1.25);
                ctx.fillStyle = '#ffe066';
                circulo(ctx, 18, 4, 1.5);
            }
        };
    };
    lienzo(scene, 'nenufar', 32, 14, dibujarNenufar(false));
    lienzo(scene, 'nenufar-flor', 32, 14, dibujarNenufar(true));

    // ---------- Arbusto de espinas (imagen aparte para poder cortarlo) ----------
    lienzo(scene, 'espinas', 120, 72, function (ctx) {
        dibujarObstaculo(ctx, 'espinas', 60, 68);
    });

    // ---------- Carne con hueso ----------
    lienzo(scene, 'carne', 44, 32, function (ctx) {
        // Hueso
        ctx.fillStyle = '#f4ecd8';
        ctx.fillRect(4, 13, 16, 6);
        circulo(ctx, 5, 12, 4);
        circulo(ctx, 5, 20, 4);
        // Carne
        var g = ctx.createRadialGradient(28, 12, 2, 28, 16, 16);
        g.addColorStop(0, '#c8643a');
        g.addColorStop(1, '#7a2e16');
        ctx.fillStyle = g;
        elipse(ctx, 29, 16, 14, 12, -0.2);
        ctx.fillStyle = 'rgba(255,220,180,0.45)';
        elipse(ctx, 25, 10, 6, 3, -0.4);
    });

    // ---------- Filete ----------
    lienzo(scene, 'filete', 44, 30, function (ctx) {
        ctx.fillStyle = '#f2dcc2';   // grasa del borde
        elipse(ctx, 22, 15, 20, 13, 0.15);
        var g = ctx.createRadialGradient(20, 12, 2, 22, 15, 18);
        g.addColorStop(0, '#d0453a');
        g.addColorStop(1, '#8a1f1a');
        ctx.fillStyle = g;
        elipse(ctx, 21, 15, 17, 10.5, 0.15);
        // Marcas de parrilla
        ctx.strokeStyle = 'rgba(50,15,10,0.7)';
        ctx.lineWidth = 2.5;
        for (var m = 0; m < 3; m++)
        {
            ctx.beginPath();
            ctx.moveTo(10 + m * 8, 22);
            ctx.lineTo(18 + m * 8, 8);
            ctx.stroke();
        }
    });

    // ---------- Bala de la torreta ----------
    lienzo(scene, 'bala', 22, 8, function (ctx) {
        var g = ctx.createLinearGradient(0, 0, 22, 0);
        g.addColorStop(0, 'rgba(255,140,40,0)');
        g.addColorStop(0.5, '#ffb347');
        g.addColorStop(1, '#fff4c2');
        ctx.fillStyle = g;
        elipse(ctx, 11, 4, 11, 3.5);
        ctx.fillStyle = '#ffffff';
        elipse(ctx, 17, 4, 4, 2);
    });
}

// Arma los cuadros de las hojas que no tienen una cuadrícula pareja
function crearCuadros (scene)
{
    // ---- Salto del Ticayo: cada gato recortado y centrado en un cuadro de 256x256 ----
    var hoja = scene.textures.get('ticayo-salto-hoja').getSourceImage();
    var salto = scene.textures.createCanvas('ticayo-salto', 256 * 5, 256 * 5);
    var ctx = salto.getContext();
    CONTORNOS_SALTO.forEach(function (c, i) {
        var cx = (i % 5) * 256;
        var cy = Math.floor(i / 5) * 256;
        var w = c[2] - c[0];
        var h = c[3] - c[1];
        ctx.drawImage(hoja, cx + c[0], cy + c[1], w, h, cx + 128 - w / 2, cy + 128 - h / 2, w, h);
        salto.add(i, 0, cx, cy, 256, 256);
    });
    salto.refresh();

    // ---- Torreta: todos los cuadros miden lo mismo (el 0 es más angosto
    // porque no tiene fogonazo, se rellena por la derecha) ----
    var tex = scene.textures.get('torreta');
    CUADROS_TORRETA.forEach(function (c, i) {
        var f = tex.add('f' + i, 0, c[0], 0, c[1], ALTO_CUADRO_TORRETA);
        if (c[1] < ANCHO_CUADRO_TORRETA)
        {
            f.setTrim(ANCHO_CUADRO_TORRETA, ALTO_CUADRO_TORRETA, 0, 0, c[1], ALTO_CUADRO_TORRETA);
        }
    });
}

function dibujarNivel (ctx, w, h)
{
    var i;

    // ---- Agua (va primero para que las orillas la tapen) ----
    for (i = 0; i < TRAMOS_SUELO.length - 1; i++)
    {
        var a = TRAMOS_SUELO[i][1] - 20;
        var b = TRAMOS_SUELO[i + 1][0] + 20;
        var g = ctx.createLinearGradient(0, AGUA_Y, 0, h);
        g.addColorStop(0, '#3fb0c0');
        g.addColorStop(0.3, '#1f7f99');
        g.addColorStop(1, '#0b3a4f');
        ctx.fillStyle = g;
        ctx.fillRect(a, AGUA_Y, b - a, h - AGUA_Y);

        // Piedras hundidas
        ctx.fillStyle = 'rgba(10,50,60,0.5)';
        for (var p = 0; p < 4; p++) elipse(ctx, rnd.between(a + 30, b - 30), rnd.between(575, 595), rnd.between(10, 22), rnd.between(5, 9));
    }

    // ---- Árboles del nivel (detrás del suelo) ----
    ARBOLES_NIVEL.forEach(function (x) {
        tronco(ctx, x, 0, SUELO_Y + 10, 100, '#3a2515', '#7a5334');
    });

    // ---- Ramas ----
    RAMAS.forEach(function (r) {
        var x = r[0], y = r[1], largo = r[2];
        var g = ctx.createLinearGradient(0, y, 0, y + 18);
        g.addColorStop(0, '#8a5d38');
        g.addColorStop(1, '#4a2f1a');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(x, y + 2);
        ctx.lineTo(x + largo, y);
        ctx.lineTo(x + largo, y + 18);
        ctx.lineTo(x, y + 14);
        ctx.closePath();
        ctx.fill();
        // Musgo encima
        ctx.fillStyle = '#4d9e45';
        ctx.fillRect(x, y - 2, largo, 5);
        ctx.fillStyle = '#6cbf5a';
        for (var k = x + 4; k < x + largo - 4; k += 6) ctx.fillRect(k, y - 4 - rnd.between(0, 3), 2, 4);
        // Hojas colgando
        ctx.fillStyle = '#2f7a44';
        for (var m = 0; m < largo / 25; m++) elipse(ctx, x + rnd.between(8, largo - 8), y + 20, 4, 9, rnd.realInRange(-0.4, 0.4));
    });

    // ---- Copas de los árboles del nivel ----
    ARBOLES_NIVEL.forEach(function (x) {
        copa(ctx, x, 30, 190, ['#1f5a34', '#2f7a44', '#4d9e56']);
        liana(ctx, x - 150, 330, 25, '#3a5a2a', '#4f9a45');
        liana(ctx, x + 170, 260, -20, '#3a5a2a', '#4f9a45');
    });

    // ---- Suelo ----
    TRAMOS_SUELO.forEach(function (t) {
        var x1 = t[0], x2 = t[1];
        var r = 16;
        var g = ctx.createLinearGradient(0, SUELO_Y, 0, h);
        g.addColorStop(0, '#7a4b2a');
        g.addColorStop(1, '#2e1a0e');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(x1, h);
        ctx.lineTo(x1, SUELO_Y + r);
        ctx.quadraticCurveTo(x1, SUELO_Y, x1 + r, SUELO_Y);
        ctx.lineTo(x2 - r, SUELO_Y);
        ctx.quadraticCurveTo(x2, SUELO_Y, x2, SUELO_Y + r);
        ctx.lineTo(x2, h);
        ctx.closePath();
        ctx.fill();

        // Piedritas y raíces en la tierra
        for (var p = 0; p < (x2 - x1) / 18; p++)
        {
            ctx.fillStyle = rnd.pick(['#5a3620', '#8a5a36', '#4a2c18']);
            elipse(ctx, rnd.between(x1 + 8, x2 - 8), rnd.between(SUELO_Y + 20, h - 5), rnd.between(2, 6), rnd.between(2, 4));
        }
        ctx.strokeStyle = 'rgba(40,20,10,0.6)';
        ctx.lineWidth = 2;
        for (var q = 0; q < (x2 - x1) / 120; q++)
        {
            var rx = rnd.between(x1 + 20, x2 - 60);
            ctx.beginPath();
            ctx.moveTo(rx, SUELO_Y + 12);
            ctx.quadraticCurveTo(rx + 20, SUELO_Y + 40, rx + rnd.between(40, 70), SUELO_Y + rnd.between(30, 60));
            ctx.stroke();
        }

        // Pasto
        ctx.fillStyle = '#2b6e2e';
        ctx.fillRect(x1 + 4, SUELO_Y + 4, x2 - x1 - 8, 8);
        ctx.fillStyle = '#3f9b3f';
        ctx.fillRect(x1 + 4, SUELO_Y - 2, x2 - x1 - 8, 8);
        ctx.lineWidth = 2;
        for (var x = x1 + 6; x < x2 - 6; x += 3)
        {
            ctx.strokeStyle = rnd.pick(['#3f9b3f', '#5cb84a', '#2f7f34', '#78c85a']);
            ctx.beginPath();
            ctx.moveTo(x, SUELO_Y + 2);
            ctx.lineTo(x + rnd.between(-3, 3), SUELO_Y - rnd.between(4, 13));
            ctx.stroke();
        }
    });

    // ---- Juncos en las orillas ----
    for (i = 0; i < TRAMOS_SUELO.length - 1; i++)
    {
        [TRAMOS_SUELO[i][1] + 6, TRAMOS_SUELO[i + 1][0] - 30].forEach(function (bx) {
            for (var j = 0; j < 6; j++)
            {
                var jx = bx + j * 4 + rnd.between(-1, 1);
                var alto = rnd.between(30, 55);
                ctx.strokeStyle = '#4f8f3a';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(jx, AGUA_Y + 8);
                ctx.quadraticCurveTo(jx + 2, AGUA_Y - alto / 2, jx + rnd.between(-5, 5), AGUA_Y - alto);
                ctx.stroke();
                if (j % 2 === 0)
                {
                    ctx.fillStyle = '#6b3f1d';
                    elipse(ctx, jx + 1, AGUA_Y - alto * 0.7, 2.5, 7);
                }
            }
        });
    }

    // ---- Obstáculos ----
    // (las espinas se dibujan aparte porque se pueden cortar)
    OBSTACULOS.forEach(function (o) {
        if (o.tipo !== 'espinas')
        {
            dibujarObstaculo(ctx, o.tipo, o.x, SUELO_Y);
        }
    });
}

function dibujarObstaculo (ctx, tipo, x, y)
{
    var g, i;

    if (tipo === 'roca')
    {
        g = ctx.createLinearGradient(x - 40, y - 50, x + 30, y);
        g.addColorStop(0, '#a39e8e');
        g.addColorStop(1, '#4a463e');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(x - 45, y + 4);
        ctx.quadraticCurveTo(x - 48, y - 30, x - 15, y - 48);
        ctx.quadraticCurveTo(x + 25, y - 55, x + 42, y - 20);
        ctx.quadraticCurveTo(x + 50, y, x + 45, y + 4);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        elipse(ctx, x - 12, y - 38, 14, 6, -0.3);
        ctx.fillStyle = '#4d8f3a';
        elipse(ctx, x + 5, y - 48, 20, 6, 0.1);
        ctx.fillStyle = '#5fa845';
        elipse(ctx, x - 5, y - 50, 10, 4);
    }
    else if (tipo === 'tronco')
    {
        var largo = 150, alto = 42;
        g = ctx.createLinearGradient(0, y - alto, 0, y);
        g.addColorStop(0, '#8a5d38');
        g.addColorStop(0.5, '#6a4428');
        g.addColorStop(1, '#3a2515');
        ctx.fillStyle = g;
        ctx.fillRect(x - largo / 2, y - alto, largo, alto);
        ctx.strokeStyle = 'rgba(30,15,5,0.5)';
        ctx.lineWidth = 2;
        for (i = 0; i < 4; i++)
        {
            ctx.beginPath();
            ctx.moveTo(x - largo / 2, y - alto + 8 + i * 9);
            ctx.lineTo(x + largo / 2, y - alto + 8 + i * 9 + rnd.between(-2, 2));
            ctx.stroke();
        }
        // Corte con anillos
        ctx.fillStyle = '#c89b6a';
        elipse(ctx, x + largo / 2, y - alto / 2, 10, alto / 2);
        ctx.strokeStyle = '#8a5d38';
        for (i = 1; i < 4; i++)
        {
            ctx.beginPath();
            ctx.ellipse(x + largo / 2, y - alto / 2, 10 - i * 2.5, alto / 2 - i * 5, 0, 0, Math.PI * 2);
            ctx.stroke();
        }
        // Hongos
        [[x - 30, '#e85d3a'], [x - 10, '#f08a4b'], [x + 30, '#e85d3a']].forEach(function (h) {
            ctx.fillStyle = '#f3e3c3';
            ctx.fillRect(h[0] - 2, y - alto - 6, 4, 8);
            ctx.fillStyle = h[1];
            elipse(ctx, h[0], y - alto - 6, 8, 5);
            ctx.fillStyle = '#fff';
            circulo(ctx, h[0] - 3, y - alto - 8, 1.3);
            circulo(ctx, h[0] + 3, y - alto - 7, 1.3);
        });
        // Musgo
        ctx.fillStyle = '#4d9e45';
        ctx.fillRect(x - largo / 2 + 10, y - alto - 2, 50, 4);
    }
    else if (tipo === 'espinas')
    {
        // Arbusto de espinas (hace daño)
        copa(ctx, x, y - 22, 36, ['#1f4a24', '#2d6630', '#3d7f3a']);
        for (i = 0; i < 14; i++)
        {
            var ang = -Math.PI + (i / 13) * Math.PI;
            var bx = x + Math.cos(ang) * 38;
            var by = y - 20 + Math.sin(ang) * 30;
            ctx.fillStyle = '#d8d0b0';
            ctx.beginPath();
            ctx.moveTo(bx - 4, by + 3);
            ctx.lineTo(bx + Math.cos(ang) * 14, by + Math.sin(ang) * 14);
            ctx.lineTo(bx + 4, by + 3);
            ctx.closePath();
            ctx.fill();
        }
        ctx.fillStyle = '#c0392b';
        for (i = 0; i < 6; i++) circulo(ctx, x + rnd.between(-25, 25), y - rnd.between(15, 40), 3);
    }
    else if (tipo === 'tocon')
    {
        g = ctx.createLinearGradient(x - 28, 0, x + 28, 0);
        g.addColorStop(0, '#3a2515');
        g.addColorStop(0.6, '#7a5334');
        g.addColorStop(1, '#3a2515');
        ctx.fillStyle = g;
        ctx.fillRect(x - 26, y - 45, 52, 47);
        ctx.beginPath();
        ctx.moveTo(x - 26, y + 2); ctx.quadraticCurveTo(x - 30, y - 10, x - 40, y + 2); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(x + 26, y + 2); ctx.quadraticCurveTo(x + 30, y - 10, x + 42, y + 2); ctx.fill();
        ctx.fillStyle = '#c89b6a';
        elipse(ctx, x, y - 45, 26, 7);
        ctx.strokeStyle = '#8a5d38';
        ctx.lineWidth = 1.5;
        for (i = 1; i < 4; i++)
        {
            ctx.beginPath();
            ctx.ellipse(x, y - 45, 26 - i * 6, 7 - i * 1.6, 0, 0, Math.PI * 2);
            ctx.stroke();
        }
    }
}
