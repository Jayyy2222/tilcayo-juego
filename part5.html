// =====================================================
//  TILCAYO - Parte 5: el jefe final
//  - Al final del nivel el jefe hace su ronda; cuando el Tilcayo se acerca
//    se ríe, se cierra la arena y empieza la pelea
//  - Al jefe se le pega con las espadas (con poder) o saltándole encima
//  - Al vencerlo se abre el camino a la pirámide: arriba está la jaula
//    con la familia del Tilcayo. Al tocarla se rescata y termina el juego
//  - Animaciones de caminar (Tilcayo_walk.png, power_walk.png) y salto del
//    guerrero (power_jump.png)
//  - Mientras se acerca al jefe se arma una tormenta fría: cielo azul oscuro,
//    aguacero y relámpagos. Al vencerlo vuelve el sol, y al rescatar a la
//    familia es un día alegre y brillante (arcoíris y mariposas)
//  - Al empezar la pelea cae una jaula alrededor de la arena, con plataformas
//    y cajas para saltar. Saltarle encima al jefe solo le quita vida a él
//  - De vez en cuando cae comida (carne de poder) del cielo
//  - Créditos al abrir, menú con botón JUGAR y una historia animada corta que
//    pasa directo al juego
//  Autores: Jaime Dennis Guzman, Leonardo Herrera Dante, Neils Laime Balderrama
//  - Animación de muerte del jefe (muerte_jefe.png)
//  - Sonidos hechos con Web Audio: espada, golpes, disparos, lluvia, truenos,
//    comer, explosión y música feliz al rescatar a la familia
//  (de la parte 4: salto y torreta; de la parte 3: carnes de poder y espadas)
//  Controles: ← → caminar, ↑ o ESPACIO saltar, X atacar (con poder), R reiniciar
// =====================================================

// Contorno del gato en cada cuadro de Tilcayo_jump.png [izq, arriba, der, abajo].

    [41, 49, 177, 125],  [42, 54, 177, 132],  [44, 59, 176, 139],  [48, 64, 176, 148], [54, 72, 175, 165],

];

// ---- Torreta enemiga ----
// Cuadros de torreta.png: [x, ancho]. El 0 está quieto, 1-3 disparando.
var CUADROS_TORRETA = [[24, 242], [285, 340], [645, 340], [1000, 340]];
var ANCHO_CUADRO_TORRETA = 340;

var TORRETA = {

// En las hojas el jefe mira a la IZQUIERDA.
var HOJAS_JEFE = {
    camina: {
        archivo: 'assets/walkjefe.png', alto: 110, pies: 98, escala: 1.45, fps: 14, repetir: -1,
        cuadros: [[13, 161, 108], [183, 162, 107], [354, 161, 108], [524, 160, 109], [695, 158, 109],
                  [861, 158, 109], [1028, 158, 109], [1195, 157, 108], [1361, 160, 109], [1530, 161, 109]]
    },
    carga: {

    },
    ataque: {
        archivo: 'assets/ataquejefe.png', alto: 126, pies: 113, escala: 1.36, fps: 16, repetir: 1,
        cuadros: [[0, 227, 184], [236, 244, 184], [488, 235, 188], [732, 243, 183],
                  [984, 225, 172], [1218, 249, 184], [1476, 225, 172], [1710, 249, 183]]
    },
    risa: {

    },
    // Recibe el golpe, se tambalea y cae al suelo (se queda en el último cuadro)
    muerte: {
        archivo: 'assets/muerte_jefe.png', alto: 108, pies: 100, escala: 1.5, fps: 8, repetir: 0,
        cuadros: [[10, 167, 130], [185, 163, 123], [357, 160, 117], [526, 159, 115],
                  [694, 159, 91], [862, 156, 87], [1027, 157, 87], [1193, 158, 88]]
    }
};

var JEFE = {
    x: 3950,
    rondaMin: 3650,       // de dónde a dónde camina antes de la pelea
    rondaMax: 4150,
    alcance: 380,         // a esta distancia ve al Tilcayo y empieza la pelea
    distanciaAtaque: 330, // se acerca hasta aquí antes de cargar el arma
    velocidadRonda: 60,
    velocidadPelea: 95,
    velocidadBala: 420,
    vida: 12,
    ancho: 70,            // caja de choque (en pantalla)
    alto: 125,
    boca: [-138, -60]     // punta del arma, desde los pies (mirando a la izquierda)
};

// Arena de la pelea: la cámara se queda aquí hasta vencer al jefe
var ARENA = { inicio: 3440, fin: 4260 };
var PEDAZO_NIVEL = 3200;   // el dibujo del nivel se parte en texturas de este ancho

// Pirámide escalonada al final del nivel, con la jaula arriba
var PIRAMIDE = { x1: 4290, x2: 4790, escalones: 6, alto: 42, paso: 30 };
var CIMA_Y = SUELO_Y - PIRAMIDE.escalones * PIRAMIDE.alto;
var CENTRO_PIRAMIDE = (PIRAMIDE.x1 + PIRAMIDE.x2) / 2;

// ---- Formas del Tilcayo ----
// caja = caja de choque en píxeles del cuadro original (256x256)
var FORMAS = {
    normal: {
        textura: 'ticayo-idle', escala: 0.55, anim: 'idle',
        caja: { ancho: 120, alto: 84, x: 95, y: 94 }      // sin la cola
    },
    // En el aire (solo sin poder). La caja mide lo mismo que la normal en pantalla.
    salto: {
        textura: 'ticayo-salto', escala: 0.62, anim: null,
        caja: { ancho: 106, alto: 74, x: 75, y: 91 }
    },
    guerrero: {
        textura: 'ticayo-power', escala: 0.5, anim: 'guerrero-idle',
        caja: { ancho: 80, alto: 166, x: 88, y: 70 }
    }
};

var VELOCIDAD = 230;
var FUERZA_SALTO = 620;

var config = {
    type: Phaser.AUTO,
    width: ANCHO,
    height: ALTO,
    physics: {
        default: 'arcade',
        arcade: {
            gravity: { y: 1300 },
            debug: false
        }
    },
    // Créditos → menú → historia → juego (los créditos cargan todos los dibujos)
    scene: [
        { key: 'creditos', preload: preload, create: crearCreditos, update: actualizarFondoAnimado },
        { key: 'menu', create: crearMenu, update: actualizarFondoAnimado },
        { key: 'historia', create: crearHistoria },
        { key: 'juego', create: create, update: update }
    ]
};

var game = new Phaser.Game(config);

var rnd;          // números aleatorios con semilla (siempre el mismo dibujo)
var capas = [];   // capas de fondo con parallax
var aguas = [];   // superficies de agua animadas
var cursors;
var teclaSalto;
var teclaAtaque;
var teclaR;

var jugador;
var forma;              // FORMAS.normal o FORMAS.guerrero
var direccion = 1;      // 1 derecha, -1 izquierda
var espinas;            // grupo de arbustos de espinas (se pueden cortar)
var vidas = 3;
var textoVidas;
var textoCentro;
var textoPoder;
var barraPoder;
var chispas;
var invulnerable = false;
var muriendo = false;
var gameOver = false;
var ultimoEnSuelo = 0;
var poderHasta = 0;     // momento en que se acaba el poder (0 = sin poder)
var puntoInicio = { x: 110, y: SUELO_Y - 60 };
var enAireDesde = 0;    // momento en que dejó el suelo (0 = en el suelo)
var torreta;            // la torreta enemiga (null cuando se destruye)
var balas;              // balas de la torreta
var numeroAtaque = 0;   // cuenta los espadazos (cada uno golpea una sola vez)
var carnes;             // carnes de poder (el jefe suelta una a media pelea)
var jefe;               // el jefe final
var muroIzq;            // paredes invisibles de la arena
var muroDer;
var barraJefe;
var textoJefe;
var jaula;              // la jaula con la familia
var ganado = false;

// ---- Tormenta: el cielo se pone frío y oscuro y llueve a medida que se acerca el jefe ----
var TORMENTA = { desde: 2300, hasta: ARENA.inicio };   // x donde empieza y donde está al máximo
var intensidad = 0;     // 0 = día tranquilo, 1 = tormenta
var rayos;              // rayos de sol (se apagan con la tormenta)
var fondoTormenta;      // tiñe de azul frío el fondo (cielo, montañas, árboles)
var nubes;              // oscurece la parte de arriba
var relampago;          // el rayo dibujado en el cielo
var tonoFrio;           // un velo azul oscuro sobre todo
var fondoRojo;          // al llegar al jefe el cielo se vuelve rojo
var tonoRojo;
var rojo = 0;           // 0 = tormenta fría, 1 = cielo rojo del jefe
var FRIO_BASE = 0.3;    // el día ya empieza un poco frío
var ROJO_DESDE = 3000;  // desde aquí el cielo empieza a ponerse rojo (máximo en la arena)
var lluvia;
var proximoRelampago = 0;

// ---- Día alegre del final (después del rescate) ----
var alegre;             // { v: 0 a 1 }, se anima con un tween
var arcoiris;
var luzAlegre;          // luz cálida sobre el fondo
var brilloAlegre;       // brillo dorado sobre todo

// ---- Comida que cae del cielo de vez en cuando ----
var proximaComida = 0;

// ---- Jaula de la arena: plataformas [x centro, y arriba] y cajas [x centro] ----
var ARENA_PLATAFORMAS = [[ARENA.inicio + 170, 410], [(ARENA.inicio + ARENA.fin) / 2, 315], [ARENA.fin - 170, 410]];
var ARENA_CAJAS = [ARENA.inicio + 64, ARENA.fin - 64];
var GROSOR_BARROTES = 30;

// Orden de dibujo: el clima va encima del juego (y de la jaula, que aparece después)
// y los textos encima de todo
var CAPA_CLIMA = 5;
var CAPA_TEXTO = 10;

var AUTORES = ['Jaime Dennis Guzman', 'Leonardo Herrera Dante', 'Neils Laime Balderrama'];

function preload ()
{
    // 21 cuadros de 256x256 en una cuadrícula de 5x5
    this.load.spritesheet('ticayo-idle', 'assets/Ticayo_idle.png', { frameWidth: 256, frameHeight: 256, endFrame: 20 });
    // 25 cuadros de 256x256: 0-5 guardia, 6-24 ataque con espadas
    this.load.spritesheet('ticayo-power', 'assets/Ticayo_power.png', { frameWidth: 256, frameHeight: 256, endFrame: 24 });
    // Estas dos hojas tienen cuadros desparejos: se cargan como imagen y
    // los cuadros se arman a mano en crearCuadros()
    this.load.image('ticayo-salto-hoja', 'assets/Tilcayo_jump.png');
    // Caminar y saltar (normal y guerrero): se alinean en crearCuadros()
    this.load.image('ticayo-camina-hoja', 'assets/Tilcayo_walk.png');
    this.load.image('guerrero-camina-hoja', 'assets/power_walk.png');
    this.load.image('guerrero-salto-hoja', 'assets/power_jump.png');
    this.load.image('torreta', 'assets/torreta.png');
    this.load.image('boton-jugar', 'assets/boton_jugar.png');
    for (var hoja in HOJAS_JEFE)
    {
        this.load.image('jefe-' + hoja, HOJAS_JEFE[hoja].archivo);
    }
}

function create ()
{
    rnd = new Phaser.Math.RandomDataGenerator(['selva-ticayo']);
    capas = [];
    aguas = [];
    invulnerable = false;
    muriendo = false;
    gameOver = false;
    poderHasta = 0;
    enAireDesde = 0;
    forma = undefined;
    ganado = false;
    puntoInicio = { x: 110, y: SUELO_Y - 60 };

    prepararRecursos(this);

    // ---- Capas de fondo (de la más lejana a la más cercana) ----
    this.add.image(0, 0, 'cielo').setOrigin(0).setScrollFactor(0);
    agregarCapa(this, 'montanas', 0.1);
    alegre = { v: 0 };
    arcoiris = this.add.image(ANCHO * 0.62, 330, 'arcoiris').setScrollFactor(0).setAlpha(0);
    agregarCapa(this, 'arboles-lejanos', 0.25);
    agregarCapa(this, 'arboles-grandes', 0.5);

    // Tormenta: capas que se van mostrando con la intensidad
    fondoTormenta = this.add.rectangle(0, 0, ANCHO, ALTO, 0x5a7bb0).setOrigin(0).setScrollFactor(0)
        .setBlendMode(Phaser.BlendModes.MULTIPLY).setAlpha(0);
    fondoRojo = this.add.rectangle(0, 0, ANCHO, ALTO, 0xd9442e).setOrigin(0).setScrollFactor(0)
        .setBlendMode(Phaser.BlendModes.MULTIPLY).setAlpha(0);
    nubes = this.add.image(0, 0, 'nubes-tormenta').setOrigin(0).setScrollFactor(0).setAlpha(0);
    rojo = 0;
    relampago = this.add.graphics().setScrollFactor(0);
    luzAlegre = this.add.rectangle(0, 0, ANCHO, ALTO, 0xfff0b0).setOrigin(0).setScrollFactor(0)
        .setBlendMode(Phaser.BlendModes.ADD).setAlpha(0);
    proximaComida = 0;
    intensidad = 0;
    proximoRelampago = 0;

    // Rayos de sol entre los árboles
    // (su brillo se calcula en actualizarTormenta: pulsa y se apaga con la tormenta)
    rayos = this.add.image(0, 0, 'rayos').setOrigin(0).setScrollFactor(0).setBlendMode(Phaser.BlendModes.ADD);

    // ---- El nivel (se mueve junto con la cámara) ----
    // (en pedazos: una textura de más de 4096 px no entra en todas las tarjetas de video)
    for (var p = 0; p * PEDAZO_NIVEL < ANCHO_NIVEL; p++)
    {
        this.add.image(p * PEDAZO_NIVEL, 0, 'nivel-' + p).setOrigin(0);
    }
    crearAgua(this);

    // ---- Físicas del nivel (cajas invisibles encima del dibujo) ----
    this.physics.world.setBounds(0, 0, ANCHO_NIVEL, ALTO);
    this.physics.world.setBoundsCollision(true, true, true, false);   // abajo abierto

    var solidos = this.physics.add.staticGroup();
    var ramas = this.physics.add.staticGroup();
    var charcos = this.physics.add.staticGroup();
    espinas = this.physics.add.staticGroup();

    TRAMOS_SUELO.forEach(function (t) {
        solidos.add(caja(this, t[0], SUELO_Y, t[1] - t[0], ALTO - SUELO_Y));
    }, this);

    RAMAS.forEach(function (r) {
        var rama = caja(this, r[0], r[1] - 2, r[2], 16);
        ramas.add(rama);
        // Solo chocan por arriba: se pueden atravesar saltando desde abajo
        rama.body.checkCollision.down = false;
        rama.body.checkCollision.left = false;
        rama.body.checkCollision.right = false;
    }, this);

    OBSTACULOS.forEach(function (o) {
        var t = CAJAS_OBSTACULO[o.tipo];
        var c = caja(this, o.x - t[0] / 2, SUELO_Y - t[1], t[0], t[1]);
        if (o.tipo === 'espinas')
        {
            // Las espinas son una imagen aparte para poder cortarlas
            c.dibujo = this.add.image(o.x, SUELO_Y + 4, 'espinas').setOrigin(0.5, 1);
            espinas.add(c);
        }
        else
        {
            solidos.add(c);
        }
    }, this);

    for (var i = 0; i < TRAMOS_SUELO.length - 1; i++)
    {
        var x1 = TRAMOS_SUELO[i][1];
        var x2 = TRAMOS_SUELO[i + 1][0];
        charcos.add(caja(this, x1, AGUA_Y + 15, x2 - x1, ALTO - AGUA_Y));
    }

    // Escalones de la pirámide (cada uno es una capa más angosta encima de la otra)
    for (var e = 0; e < PIRAMIDE.escalones; e++)
    {
        var margen = e * PIRAMIDE.paso;
        solidos.add(caja(this, PIRAMIDE.x1 + margen, SUELO_Y - (e + 1) * PIRAMIDE.alto,
            PIRAMIDE.x2 - PIRAMIDE.x1 - margen * 2, PIRAMIDE.alto));
    }

    // Paredes invisibles de la arena: la derecha tapa la pirámide hasta vencer al jefe,
    // la izquierda se cierra cuando empieza la pelea
    muroDer = caja(this, ARENA.fin - GROSOR_BARROTES, 0, GROSOR_BARROTES, SUELO_Y);
    muroIzq = null;

    // ---- Carnes de poder ----
    carnes = this.physics.add.staticGroup();
    CARNES.forEach(function (c) {
        crearCarne(this, c[0], c[1], c[2]);
    }, this);


    // ---- Torreta, jefe y jaula (antes del Tilcayo para que queden detrás de él) ----
    crearTorreta(this);
    crearJaula(this);
    crearJefe(this);

    // ---- Tilcayo ----
    jugador = this.physics.add.sprite(puntoInicio.x, puntoInicio.y, 'ticayo-idle');
    jugador.setCollideWorldBounds(true);
    ponerForma(jugador, FORMAS.normal);

    torreta.colisor = this.physics.add.collider(jugador, torreta.caja);
    this.physics.add.collider(jugador, muroDer);
    this.physics.add.overlap(jugador, jaula.zona, rescatarFamilia, null, this);

    this.physics.add.collider(jugador, solidos);
    this.physics.add.collider(jugador, ramas);
    this.physics.add.overlap(jugador, espinas, tocarEspinas, null, this);
    this.physics.add.overlap(jugador, charcos, caerAlAgua, null, this);
    this.physics.add.overlap(jugador, carnes, comerCarne, null, this);

    // Balas de la torreta: se rompen contra el suelo y los obstáculos
    balas = this.physics.add.group({ allowGravity: false });
    this.physics.add.collider(balas, solidos, romperBala, null, this);
    this.physics.add.overlap(jugador, balas, tocarBala, null, this);

    // Chispas para efectos (comer, cortar espinas)
    chispas = this.add.particles(0, 0, 'luz', {
        speed: { min: 80, max: 260 },
        lifespan: 600,
        scale: { start: 1.2, end: 0 },
        blendMode: 'ADD',
        emitting: false
    });

    // Luciérnagas
    this.add.particles(0, 0, 'luz', {
        x: { min: 0, max: ANCHO_NIVEL },
        y: { min: 150, max: 500 },
        lifespan: 4000,
        speedX: { min: -15, max: 15 },
        speedY: { min: -15, max: 10 },
        scale: { start: 0.7, end: 0 },
        alpha: { start: 1, end: 0 },
        frequency: 90,
        blendMode: 'ADD'
    });

    // ---- Primer plano: helechos y hojas colgantes (van más rápido que la cámara) ----
    agregarCapa(this, 'follaje-frente', 1.3);

    // Lluvia inclinada (fija a la pantalla); arranca apagada
    lluvia = this.add.particles(0, 0, 'gota', {
        x: { min: -100, max: ANCHO + 200 },
        y: -20,
        lifespan: 900,
        speedY: { min: 750, max: 950 },
        speedX: { min: -330, max: -260 },
        rotate: 19,
        alpha: { min: 0.35, max: 0.8 },
        scaleY: { min: 0.7, max: 1.3 },
        frequency: 40,
        emitting: false
    }).setScrollFactor(0).setDepth(CAPA_CLIMA);
    tonoFrio = this.add.rectangle(0, 0, ANCHO, ALTO, 0x0b1a33).setOrigin(0).setScrollFactor(0).setAlpha(0).setDepth(CAPA_CLIMA);
    tonoRojo = this.add.rectangle(0, 0, ANCHO, ALTO, 0x6a0505).setOrigin(0).setScrollFactor(0).setAlpha(0).setDepth(CAPA_CLIMA);
    brilloAlegre = this.add.rectangle(0, 0, ANCHO, ALTO, 0xffe7a0).setOrigin(0).setScrollFactor(0)
        .setBlendMode(Phaser.BlendModes.ADD).setAlpha(0).setDepth(CAPA_CLIMA);

    // Hojas que caen
    this.add.particles(0, 0, 'hoja', {
        x: { min: 0, max: ANCHO },
        y: -10,
        lifespan: 14000,
        speedY: { min: 25, max: 55 },
        speedX: { min: -35, max: 35 },
        rotate: { start: 0, end: 540 },
        scale: { min: 0.8, max: 1.4 },
        frequency: 700
    }).setScrollFactor(0);

    // Viñeta (oscurece los bordes, da look más "pro")
    this.add.image(0, 0, 'vineta').setOrigin(0).setScrollFactor(0).setDepth(CAPA_CLIMA);

    // ---- Cámara ----
    this.cameras.main.setBounds(0, 0, ANCHO_NIVEL, ALTO);
    this.cameras.main.setZoom(1);
    this.cameras.main.fadeIn(500, 0, 0, 0);
    this.cameras.main.startFollow(jugador, true, 0.12, 0.12);
    this.cameras.main.setDeadzone(100, 120);

    // ---- Controles ----
    cursors = this.input.keyboard.createCursorKeys();
    teclaSalto = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
    teclaAtaque = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.X);
    teclaR = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.R);

    // ---- HUD ----
    var estilo = { fontSize: '22px', fontStyle: 'bold', color: '#ffffff', stroke: '#000000', strokeThickness: 5 };
    textoVidas = this.add.text(16, 16, '', estilo).setScrollFactor(0);
    textoPoder = this.add.text(16, 48, '', { fontSize: '18px', fontStyle: 'bold', color: '#ffd166', stroke: '#000000', strokeThickness: 5 }).setScrollFactor(0);
    barraPoder = this.add.graphics().setScrollFactor(0);
    barraJefe = this.add.graphics().setScrollFactor(0);
    textoJefe = this.add.text(ANCHO / 2, 40, '', { fontSize: '16px', fontStyle: 'bold', color: '#ffffff', stroke: '#000000', strokeThickness: 4 })
        .setOrigin(0.5, 0).setScrollFactor(0);
    textoCentro = this.add.text(ANCHO / 2, ALTO / 2, '', { fontSize: '40px', fontStyle: 'bold', color: '#ffffff', stroke: '#000000', strokeThickness: 7, align: 'center' })
        .setOrigin(0.5).setScrollFactor(0);
    [textoVidas, textoPoder, barraPoder, barraJefe, textoJefe, textoCentro].forEach(function (o) {
        o.setDepth(CAPA_TEXTO);
    });
    actualizarHUD();
}

function update (time)
{
    var cam = this.cameras.main;

    // Parallax: cada capa se mueve a su propia velocidad
    capas.forEach(function (capa) {
        capa.sprite.tilePositionX = cam.scrollX * capa.factor;
    });

    // Olas del agua
    aguas.forEach(function (agua) {
        agua.claro.tilePositionX += 0.4;
        agua.oscuro.tilePositionX -= 0.25;
    });

    actualizarTormenta(this, time);

    if (gameOver)
    {
        if (ganado)
        {
            actualizarFinal();
        }
        if (Phaser.Input.Keyboard.JustDown(teclaR))
        {
            vidas = 3;
            this.scene.restart();
        }
        return;
    }

    if (muriendo)
    {
        return;
    }

    // ---- Tiempo del poder ----
    if (poderHasta > 0)
    {
        var restante = poderHasta - time;
        if (restante <= 0)
        {
            quitarPoder(this);
        }
        else
        {
            dibujarBarraPoder(restante);
            // Parpadea en los últimos 5 segundos para avisar
            if (!invulnerable)
            {
                jugador.setAlpha(restante < 5000 && Math.floor(time / 120) % 2 === 0 ? 0.5 : 1);
            }
        }
    }

    var enSuelo = jugador.body.blocked.down || jugador.body.touching.down;
    if (enSuelo)
    {
        ultimoEnSuelo = time;
    }

    // Caminar
    if (cursors.left.isDown)
    {
        jugador.setVelocityX(-VELOCIDAD);
        mirarA(jugador, -1);
    }
    else if (cursors.right.isDown)
    {
        jugador.setVelocityX(VELOCIDAD);
        mirarA(jugador, 1);
    }
    else
    {
        jugador.setVelocityX(0);
    }

    // Saltar (con 100 ms de margen al salir de un borde)
    var saltar = Phaser.Input.Keyboard.JustDown(cursors.up) || Phaser.Input.Keyboard.JustDown(teclaSalto);
    if (saltar && time - ultimoEnSuelo < 100)
    {
        jugador.setVelocityY(-FUERZA_SALTO);
        ultimoEnSuelo = 0;
    }

    // Salto variable: si suelta el botón antes, salta más bajo
    if (!cursors.up.isDown && !teclaSalto.isDown && jugador.body.velocity.y < -250)
    {
        jugador.setVelocityY(-250);
    }

    // ---- Forma de salto (solo sin poder) ----
    if (enSuelo)
    {
        enAireDesde = 0;
    }
    else if (enAireDesde === 0)
    {
        enAireDesde = time;
    }

    // Saltó, o lleva un ratito cayendo (así no parpadea en los bordes)
    var enAire = !enSuelo && (jugador.body.velocity.y < 0 || time - enAireDesde > 80);

    if (forma !== FORMAS.guerrero)
    {
        if (enAire && forma !== FORMAS.salto)
        {
            ponerForma(jugador, FORMAS.salto);
        }
        else if (!enAire && forma === FORMAS.salto)
        {
            ponerForma(jugador, FORMAS.normal);
        }

        if (forma === FORMAS.salto)
        {
            jugador.setFrame(cuadroSalto(jugador.body.velocity.y));
        }
    }

    // ---- Torreta y balas ----
    actualizarTorreta(this, time);
    actualizarJefe(this, time);
    actualizarComida(this, time);
    balas.getChildren().slice().forEach(function (b) {
        if (b.x < cam.scrollX - 50 || b.x > cam.scrollX + ANCHO + 50)
        {
            b.destroy();
        }
    });

    // ---- Ataque (solo con poder) ----
    var atacando = jugador.anims.isPlaying && jugador.anims.currentAnim.key === 'ataque';
    if (forma === FORMAS.guerrero && !atacando && Phaser.Input.Keyboard.JustDown(teclaAtaque))
    {
        jugador.anims.play('ataque');
        Sonido.espada();
        numeroAtaque++;
        atacando = true;
    }

    if (atacando)
    {
        // Los cuadros 12-19 son el golpe de espada
        var cuadro = jugador.anims.currentFrame.index + 5;
        if (cuadro >= 12 && cuadro <= 19)
        {
            golpearEspinas(this);
            golpearTorreta(this);
            golpearJefeConEspada(this, time);
        }
    }
    else if (forma === FORMAS.guerrero && enAire)
    {
        // Guerrero en el aire: el cuadro depende de la velocidad, como el gato
        jugador.anims.stop();
        jugador.setTexture('guerrero-salto', cuadroSaltoGuerrero(jugador.body.velocity.y));
    }
    else if (forma.anim)
    {
        var caminando = jugador.body.velocity.x !== 0;
        if (forma === FORMAS.guerrero)
        {
            jugador.anims.play(caminando ? 'guerrero-camina' : 'guerrero-idle', true);
        }
        else
        {
            jugador.anims.play(caminando ? 'camina' : 'idle', true);
        }
    }
}

// Cuadros del guerrero en el aire: 0-2 subiendo, 3-5 bajando
function cuadroSaltoGuerrero (vy)
{
    if (vy < 0)
    {
        return Math.round(Phaser.Math.Clamp(1 + vy / FUERZA_SALTO, 0, 1) * 2);
    }
    return 3 + Math.round(Phaser.Math.Clamp(vy / 700, 0, 1) * 2);
}

// Animaciones (son globales: sirven para el menú, la historia y el juego)
function crearAnimaciones (scene)
{
    scene.anims.create({
        key: 'idle',
        frames: scene.anims.generateFrameNumbers('ticayo-idle', { start: 0, end: 20 }),
        frameRate: 12,
        repeat: -1
    });
    scene.anims.create({
        key: 'guerrero-idle',
        frames: scene.anims.generateFrameNumbers('ticayo-power', { start: 0, end: 5 }),
        frameRate: 8,
        yoyo: true,
        repeat: -1
    });
    scene.anims.create({
        key: 'camina',
        frames: scene.anims.generateFrameNumbers('ticayo-camina', { start: 0, end: 24 }),
        frameRate: 30,
        repeat: -1
    });
    scene.anims.create({
        key: 'guerrero-camina',
        frames: scene.anims.generateFrameNumbers('guerrero-camina', { start: 0, end: 11 }),
        frameRate: 14,
        repeat: -1
    });
    scene.anims.create({
        key: 'ataque',
        frames: scene.anims.generateFrameNumbers('ticayo-power', { start: 6, end: 24 }),
        frameRate: 32
    });
    scene.anims.create({
        key: 'torreta-disparo',
        frames: [1, 2, 3, 0].map(function (n) { return { key: 'torreta', frame: 'f' + n }; }),
        frameRate: 18
    });
    for (var hoja in HOJAS_JEFE)
    {
        var datos = HOJAS_JEFE[hoja];
        var clave = 'jefe-' + hoja;
        scene.anims.create({
            key: clave,
            frames: datos.cuadros.map(function (c, n) { return { key: clave, frame: n }; }),
            frameRate: datos.fps,
            repeat: datos.repetir
        });
    }
}

// Dibujos, cuadros y animaciones: se arman una sola vez (en el menú)
function prepararRecursos (scene)
{
    if (scene.textures.exists('cielo'))
    {
        return;
    }
    rnd = new Phaser.Math.RandomDataGenerator(['selva-ticayo']);
    crearTexturas(scene);
    crearCuadros(scene);
    crearAnimaciones(scene);
}

// Elige el cuadro del salto según la velocidad vertical:
// 4-11 subiendo (se estira), 12-19 bajando (se prepara para caer)
function cuadroSalto (vy)
{
    var t;
    if (vy < 0)
    {
        t = Phaser.Math.Clamp(1 + vy / FUERZA_SALTO, 0, 1);
        return 4 + Math.round(t * 7);
    }
    t = Phaser.Math.Clamp(vy / 700, 0, 1);
    return 12 + Math.round(t * 7);
}

// Caja invisible con cuerpo físico estático
function caja (scene, x, y, w, h)
{
    var z = scene.add.zone(x + w / 2, y + h / 2, w, h);
    scene.physics.add.existing(z, true);
    return z;
}

// Cambia la forma del Tilcayo (normal o guerrero) sin moverle los pies
function ponerForma (sprite, nueva)
{
    var pies = sprite.body.bottom;
    var cambio = forma !== undefined && forma !== nueva;

    forma = nueva;
    sprite.setTexture(nueva.textura, 0);
    sprite.setScale(nueva.escala);
    sprite.body.setSize(nueva.caja.ancho, nueva.caja.alto, false);
    mirarA(sprite, direccion);
    if (nueva.anim)
    {
        sprite.anims.play(nueva.anim);
    }
    else
    {
        sprite.anims.stop();   // el salto elige su cuadro según la velocidad
    }

    if (cambio)
    {
        // El centro del cuadro está en 128: pone los pies donde estaban
        // (y conserva la velocidad, para poder cambiar de forma en el aire)
        var vx = sprite.body.velocity.x;
        var vy = sprite.body.velocity.y;
        sprite.y = pies - (nueva.caja.y + nueva.caja.alto - 128) * nueva.escala;
        sprite.body.reset(sprite.x, sprite.y);
        sprite.setVelocity(vx, vy);
    }
}

// Voltea al Tilcayo y acomoda su caja de choque
function mirarA (sprite, dir)
{
    direccion = dir;
    sprite.setFlipX(dir < 0);
    var c = forma.caja;
    var offsetX = dir < 0 ? 256 - c.x - c.ancho : c.x;
    sprite.body.setOffset(offsetX, c.y);
}

function comerCarne (j, carne)
{
    if (muriendo || gameOver)
    {
        return;
    }

    chispas.explode(20, carne.x, carne.y);
    Sonido.comer();
    carne.brillo.destroy();
    this.tweens.killTweensOf(carne);
    carne.destroy();

    activarPoder(this);
}

function activarPoder (scene)
{
    var yaTenia = poderHasta > 0;
    poderHasta = scene.time.now + DURACION_PODER;

    if (yaTenia)
    {
        mostrarAviso(scene, '+30 s', '#ffd166');
        return;
    }

    ponerForma(jugador, FORMAS.guerrero);
    scene.cameras.main.flash(250, 255, 220, 150);
    scene.cameras.main.shake(200, 0.006);
    mostrarAviso(scene, '¡PODER DE ATAQUE!\nX para atacar', '#ffd166');
}

function quitarPoder (scene)
{
    poderHasta = 0;
    barraPoder.clear();
    textoPoder.setText('');
    jugador.setAlpha(1);
    if (forma === FORMAS.guerrero)
    {
        ponerForma(jugador, FORMAS.normal);
        chispas.explode(12, jugador.x, jugador.y);
    }
}

// Rectángulo que alcanza la espada, delante del Tilcayo
function zonaEspada ()
{
    var b = jugador.body;
    var alcance = 70;
    return new Phaser.Geom.Rectangle(
        direccion > 0 ? b.right - 10 : b.left - alcance + 10,
        b.top + 20,
        alcance,
        b.height - 20
    );
}

// Revisa si la espada toca algún arbusto de espinas y lo corta
function golpearEspinas (scene)
{
    var zona = zonaEspada();

    espinas.getChildren().slice().forEach(function (e) {
        if (Phaser.Geom.Intersects.RectangleToRectangle(zona, e.getBounds()))
        {
            chispas.explode(16, e.x, e.y);
            Sonido.corte();
            scene.tweens.add({
                targets: e.dibujo, scaleY: 0, alpha: 0, duration: 250,
                onComplete: function (tween, targets) { targets[0].destroy(); }
            });
            e.destroy();
        }
    });
}

function mostrarAviso (scene, texto, color)
{
    var aviso = scene.add.text(ANCHO / 2, 140, texto, {
        fontSize: '34px', fontStyle: 'bold', color: color, stroke: '#000000', strokeThickness: 7, align: 'center'
    }).setOrigin(0.5).setScrollFactor(0).setScale(0.3).setDepth(CAPA_TEXTO);

    scene.tweens.add({ targets: aviso, scale: 1, duration: 250, ease: 'Back.easeOut' });
    scene.tweens.add({ targets: aviso, alpha: 0, y: 110, delay: 1400, duration: 500, onComplete: function () { aviso.destroy(); } });
}

function dibujarBarraPoder (restante)
{
    var ancho = 180;
    var parte = restante / DURACION_PODER;
    textoPoder.setText('PODER ' + Math.ceil(restante / 1000) + ' s');
    barraPoder.clear();
    barraPoder.fillStyle(0x000000, 0.6);
    barraPoder.fillRoundedRect(14, 72, ancho + 4, 14, 5);
    barraPoder.fillStyle(parte < 0.17 ? 0xff5a36 : 0xffb703, 1);
    barraPoder.fillRoundedRect(16, 74, ancho * parte, 10, 4);
}

function perderVida (scene)
{
    vidas--;
    actualizarHUD();
    if (vidas <= 0)
    {
        gameOver = true;
        scene.physics.pause();
        jugador.anims.stop();
        jugador.setTint(0xff6666);
        textoCentro.setText('GAME OVER\nPresiona R para reiniciar');
        return false;
    }
    return true;
}

function tocarEspinas (j, espina)
{
    herir(this, espina.x);
}

// El Tilcayo recibe un golpe que viene desde la posición desdeX
function herir (scene, desdeX)
{
    if (invulnerable || muriendo || gameOver)
    {
        return;
    }

    Sonido.herido();

    // Con poder: pierde el poder en vez de una vida (como Mario)
    if (poderHasta > 0)
    {
        quitarPoder(scene);
    }
    else if (!perderVida(scene))
    {
        return;
    }

    // Empujón hacia atrás y parpadeo
    invulnerable = true;
    var dir = jugador.x < desdeX ? -1 : 1;
    jugador.setVelocity(dir * 260, -380);
    jugador.setTint(0xff6666);
    scene.tweens.add({ targets: jugador, alpha: 0.3, duration: 100, yoyo: true, repeat: 7 });
    scene.time.delayedCall(1600, function () {
        invulnerable = false;
        jugador.clearTint().setAlpha(1);
    });
}

// =====================================================
//  TORRETA
// =====================================================

function crearTorreta (scene)
{
    var sprite = scene.add.sprite(TORRETA.x, SUELO_Y + 2, 'torreta', 'f0').setScale(ESCALA_TORRETA);

    // Caja de choque: el soldado con la base (sin el cañón que sobresale)
    var ancho = 190 * ESCALA_TORRETA;
    var alto = (PIES_TORRETA - 40) * ESCALA_TORRETA;
    var cajaTorreta = caja(scene, TORRETA.x - ancho / 2, SUELO_Y - alto, ancho, alto);

    torreta = {
        sprite: sprite,
        caja: cajaTorreta,
        vida: TORRETA.vida,
        dir: -1,
        proximoDisparo: 0,
        ultimoGolpe: -1,
        colisor: null
    };
    mirarTorreta(-1);
}

// Voltea la torreta sobre el eje del soldado
function mirarTorreta (dir)
{
    torreta.dir = dir;
    torreta.sprite.setFlipX(dir < 0);
    var centro = dir < 0 ? ANCHO_CUADRO_TORRETA - CENTRO_TORRETA : CENTRO_TORRETA;
    torreta.sprite.setOrigin(centro / ANCHO_CUADRO_TORRETA, PIES_TORRETA / ALTO_CUADRO_TORRETA);
}

function actualizarTorreta (scene, time)
{
    if (!torreta)
    {
        return;
    }

    var distancia = jugador.x - TORRETA.x;
    if (Math.abs(distancia) > TORRETA.alcance || muriendo)
    {
        // Fuera de alcance: al entrar espera un momento antes del primer disparo
        torreta.proximoDisparo = time + 600;
        return;
    }

    mirarTorreta(distancia < 0 ? -1 : 1);

    if (time >= torreta.proximoDisparo)
    {
        torreta.proximoDisparo = time + TORRETA.cadencia;
        dispararTorreta(scene);
    }
}

function dispararTorreta (scene)
{
    torreta.sprite.anims.play('torreta-disparo');
    Sonido.disparo(0.35);

    // La boca del cañón, pasada a coordenadas del mundo
    var bx = TORRETA.x + (BOCA_CANON[0] - CENTRO_TORRETA) * ESCALA_TORRETA * torreta.dir;
    var by = SUELO_Y + 2 - (PIES_TORRETA - BOCA_CANON[1]) * ESCALA_TORRETA;

    var bala = balas.create(bx, by, 'bala');
    bala.setFlipX(torreta.dir < 0);
    bala.body.setSize(14, 6);
    bala.setVelocityX(TORRETA.velocidadBala * torreta.dir);
}

function romperBala (bala)
{
    chispas.explode(6, bala.x, bala.y);
    bala.destroy();
}

function tocarBala (j, bala)
{
    var desde = bala.x - bala.body.velocity.x;   // de dónde venía
    if (bala.delJefe && jefe)
    {
        jefe.acerto = true;
    }
    romperBala(bala);
    herir(this, desde);
}

// Revisa si la espada le pega a la torreta (una vez por espadazo)
function golpearTorreta (scene)
{
    if (!torreta || torreta.ultimoGolpe === numeroAtaque)
    {
        return;
    }
    if (!Phaser.Geom.Intersects.RectangleToRectangle(zonaEspada(), torreta.caja.getBounds()))
    {
        return;
    }

    torreta.ultimoGolpe = numeroAtaque;
    torreta.vida--;
    Sonido.golpe();
    chispas.explode(14, torreta.caja.x, torreta.caja.y);
    scene.cameras.main.shake(120, 0.005);

    if (torreta.vida > 0)
    {
        torreta.sprite.setTintFill(0xffffff);
        scene.time.delayedCall(90, function () {
            if (torreta) torreta.sprite.clearTint();
        });
        return;
    }

    // Destruida
    var t = torreta;
    torreta = null;
    t.colisor.destroy();
    t.caja.destroy();
    chispas.explode(40, t.sprite.x, t.sprite.y - 40);
    scene.cameras.main.flash(200, 255, 200, 120);
    t.sprite.anims.stop();
    t.sprite.setTint(0x555555);
    scene.tweens.add({
        targets: t.sprite, alpha: 0, angle: 12 * -t.dir, y: t.sprite.y + 10, duration: 700,
        onComplete: function () { t.sprite.destroy(); }
    });
    mostrarAviso(scene, '¡TORRETA DESTRUIDA!', '#7ee081');
}

function caerAlAgua ()
{
    if (muriendo || gameOver)
    {
        return;
    }
    muriendo = true;

    if (poderHasta > 0)
    {
        quitarPoder(this);
    }

    jugador.setVelocity(0, 0);
    jugador.body.allowGravity = false;
    jugador.setTint(0x6fa8ff);
    this.tweens.add({ targets: jugador, y: jugador.y + 25, alpha: 0.3, duration: 600 });

    if (!perderVida(this))
    {
        return;
    }

    this.time.delayedCall(900, function () {
        jugador.clearTint().setAlpha(1).setPosition(puntoInicio.x, puntoInicio.y);
        jugador.body.allowGravity = true;
        mirarA(jugador, 1);
        muriendo = false;
    });
}

function actualizarHUD ()
{
    textoVidas.setText('Vidas: ' + '♥ '.repeat(Math.max(vidas, 0)));
}

function agregarCapa (scene, clave, factor)
{
    var sprite = scene.add.tileSprite(0, 0, ANCHO, ALTO, clave).setOrigin(0).setScrollFactor(0);
    capas.push({ sprite: sprite, factor: factor });
}

function crearAgua (scene)
{
    for (var i = 0; i < TRAMOS_SUELO.length - 1; i++)
    {
        var x1 = TRAMOS_SUELO[i][1];
        var x2 = TRAMOS_SUELO[i + 1][0];
        var ancho = x2 - x1;

        // Dos capas de olas que se mueven en sentidos contrarios
        var oscuro = scene.add.tileSprite(x1, AGUA_Y + 6, ancho, 12, 'ola-oscura').setOrigin(0);
        var claro = scene.add.tileSprite(x1, AGUA_Y - 3, ancho, 12, 'ola').setOrigin(0);
        aguas.push({ claro: claro, oscuro: oscuro });

        // Brillos que aparecen y desaparecen
        for (var b = 0; b < ancho / 25; b++)
        {
            var brillo = scene.add.rectangle(x1 + rnd.between(10, ancho - 10), rnd.between(AGUA_Y + 4, ALTO - 20), rnd.between(6, 16), 2, 0xffffff, 0);
            scene.tweens.add({
                targets: brillo, fillAlpha: 0.6, duration: rnd.between(600, 1400),
                yoyo: true, repeat: -1, delay: rnd.between(0, 3000), repeatDelay: rnd.between(500, 2500)
            });
        }

        // Nenúfares flotando
        for (var n = 0; n < ancho / 60; n++)
        {
            var nenufar = scene.add.image(x1 + 25 + n * 60 + rnd.between(-10, 10), AGUA_Y + 2, rnd.frac() < 0.3 ? 'nenufar-flor' : 'nenufar');
            scene.tweens.add({ targets: nenufar, y: AGUA_Y + 5, angle: rnd.between(-4, 4), duration: rnd.between(1400, 2200), yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
        }
    }
}

// =====================================================
//  SONIDOS (hechos con Web Audio: no hacen falta archivos)
//  Si el navegador no tiene Web Audio, no suenan y el juego sigue igual.
//  El audio se habilita con el primer clic o tecla (en el menú).
// =====================================================

var Sonido = {
    maestro: null,
    ruido: null,         // ruido blanco que se reutiliza (lluvia, disparos, truenos)
    volLluvia: null,
    ultimaLluvia: -1,

    ctx: function () {
        var c = game.sound && game.sound.context;
        if (!c)
        {
            return null;
        }
        if (!this.maestro)
        {
            this.maestro = c.createGain();
            this.maestro.gain.value = 0.5;
            this.maestro.connect(c.destination);
            var largo = c.sampleRate * 2;
            this.ruido = c.createBuffer(1, largo, c.sampleRate);
            var datos = this.ruido.getChannelData(0);
            for (var i = 0; i < largo; i++) datos[i] = Math.random() * 2 - 1;
        }
        return c;
    },

    // Ráfaga de ruido con un filtro que barre de una frecuencia a otra
    soplo: function (tipo, desde, hasta, dur, vol, retraso, q)
    {
        var c = this.ctx();
        if (!c) return;
        var t = c.currentTime + (retraso || 0);
        var fuente = c.createBufferSource();
        fuente.buffer = this.ruido;
        var filtro = c.createBiquadFilter();
        filtro.type = tipo;
        filtro.Q.value = q || 1;
        filtro.frequency.setValueAtTime(desde, t);
        filtro.frequency.exponentialRampToValueAtTime(hasta, t + dur);
        var g = c.createGain();
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        fuente.connect(filtro);
        filtro.connect(g);
        g.connect(this.maestro);
        fuente.start(t, Math.random() * 1.5);
        fuente.stop(t + dur + 0.05);
    },

    // Una nota: forma de onda, frecuencia inicial y final
    tono: function (onda, desde, hasta, dur, vol, retraso)
    {
        var c = this.ctx();
        if (!c) return;
        var t = c.currentTime + (retraso || 0);
        var o = c.createOscillator();
        o.type = onda;
        o.frequency.setValueAtTime(desde, t);
        if (hasta !== desde) o.frequency.exponentialRampToValueAtTime(hasta, t + dur);
        var g = c.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g);
        g.connect(this.maestro);
        o.start(t);
        o.stop(t + dur + 0.05);
    },

    // ---- Ataques ----
    espada: function ()
    {
        this.soplo('bandpass', 3500, 500, 0.25, 0.6, 0, 2);   // zas
        this.tono('sine', 1200, 300, 0.15, 0.06);
    },
    corte: function ()
    {
        this.soplo('highpass', 2000, 6000, 0.18, 0.4);
    },
    golpe: function ()
    {
        this.tono('square', 170, 55, 0.16, 0.25);
        this.soplo('lowpass', 2500, 200, 0.12, 0.5);
        this.tono('triangle', 1500, 1400, 0.12, 0.08);        // clinc metálico
    },
    pisoton: function ()
    {
        this.tono('sine', 260, 720, 0.16, 0.3);               // boing
    },
    disparo: function (vol)
    {
        this.soplo('lowpass', 5000, 300, 0.12, vol);
        this.tono('sawtooth', 200, 50, 0.1, vol * 0.4);
    },
    herido: function ()
    {
        this.tono('sawtooth', 420, 140, 0.28, 0.18);
    },
    comer: function ()
    {
        this.tono('square', 520, 880, 0.08, 0.12);
        this.tono('square', 880, 1320, 0.1, 0.12, 0.08);
    },
    explosion: function ()
    {
        this.soplo('lowpass', 1800, 60, 1.4, 0.9, 0, 0.7);
        this.tono('sine', 110, 30, 0.9, 0.5);
    },

    // ---- Clima ----
    trueno: function ()
    {
        this.soplo('highpass', 3000, 1500, 0.15, 0.3);         // chasquido
        this.soplo('lowpass', 700, 60, 2.4, 0.9, 0.25, 0.7);   // retumbe
    },
    // Lluvia continua: 0 = callada, 1 = aguacero
    lluvia: function (fuerza)
    {
        var c = this.ctx();
        if (!c) return;
        if (!this.volLluvia)
        {
            var fuente = c.createBufferSource();
            fuente.buffer = this.ruido;
            fuente.loop = true;
            var grave = c.createBiquadFilter();
            grave.type = 'highpass';
            grave.frequency.value = 700;
            var agudo = c.createBiquadFilter();
            agudo.type = 'lowpass';
            agudo.frequency.value = 7000;
            this.volLluvia = c.createGain();
            this.volLluvia.gain.value = 0;
            fuente.connect(grave);
            grave.connect(agudo);
            agudo.connect(this.volLluvia);
            this.volLluvia.connect(this.maestro);
            fuente.start();
        }
        if (Math.abs(fuerza - this.ultimaLluvia) > 0.01)
        {
            this.ultimaLluvia = fuerza;
            this.volLluvia.gain.setTargetAtTime(fuerza * 0.3, c.currentTime, 0.4);
        }
    },

    // ---- Música feliz ----
    fanfarria: function ()
    {
        var notas = [392, 523, 659, 784];
        for (var i = 0; i < notas.length; i++)
        {
            this.tono('triangle', notas[i], notas[i], i === 3 ? 0.7 : 0.14, 0.2, 0.5 + i * 0.13);
        }
    },
    melodiaFeliz: function ()
    {
        // Do mayor, alegre y saltarina: [nota Hz, duración en tiempos]
        var melodia = [
            [523, 1], [659, 1], [784, 1], [1047, 2], [784, 1], [880, 1], [784, 1], [659, 2],
            [698, 1], [880, 1], [1047, 1], [880, 2], [784, 1], [659, 1], [587, 1], [523, 3]
        ];
        var bajos = [131, 131, 175, 196];   // Do, Do, Fa, Sol
        var tiempo = 0.2;
        var t = 0;
        var c = this.ctx();
        if (!c) return;
        var self = this;
        melodia.forEach(function (n) {
            self.tono('triangle', n[0], n[0], n[1] * tiempo * 0.95, 0.18, t);
            t += n[1] * tiempo;
        });
        bajos.forEach(function (b, i) {
            self.tono('sine', b, b, 1.5, 0.22, i * 1.6);
        });
    }
};

// Fondo de selva para el menú y la historia (el comienzo del nivel, quieto)
function fondoSelva (scene)
{
    capas = [];
    scene.add.image(0, 0, 'cielo').setOrigin(0);

// Las capas del fondo se mueven solas despacito
function actualizarFondoAnimado ()
{
    capas.forEach(function (capa) {
        capa.sprite.tilePositionX += capa.factor * 0.4;

}

function luciernagas (scene)
{
    scene.add.particles(0, 0, 'luz', {
        x: { min: 0, max: ANCHO }, y: { min: 150, max: 500 },
        lifespan: 4000, speedX: { min: -15, max: 15 }, speedY: { min: -15, max: 10 },

    });

// y de un gato (hoja de 256) para que pise el suelo: los pies están 50 px bajo el centro
function yGato (escala)
{
    return SUELO_Y + 2 - 50 * escala;
}

// Pone al jefe con una de sus hojas (fuera de la pelea: menú e historia)
function poseJefe (sprite, hoja, dir)
{
    var h = HOJAS_JEFE[hoja];
    sprite.setScale(h.escala);
    sprite.anims.play('jefe-' + hoja, true);
    sprite.setFlipX(dir > 0);
    var ancla = dir > 0 ? h.anchoCuadro - h.ancla : h.ancla;
    sprite.setOrigin(ancla / h.anchoCuadro, h.pies / h.alto);
}
